<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Drinkmaster</title>
  <style>
    :root { --bg-color: #0d0d0d; --neon-cyan: #00f3ff; --neon-pink: #ff00ea; --text-main: #ffffff; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }
    
    .container { max-width: 900px; margin: 0 auto; background: #1a1a1a; padding: 20px; border-radius: 10px; border: 1px solid #333;}
    h1 { color: var(--neon-cyan); margin-bottom: 20px; text-align: center; }
    
    input { background: #111; border: 1px solid #444; color: white; padding: 10px; width: 100%; margin-bottom: 10px; border-radius: 5px;}
    button { background: var(--neon-pink); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 20px;}
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }

    .list-section { background: #111; padding: 15px; border-radius: 8px; border: 1px solid #333; }
    .list-section h2 { color: #aaa; font-size: 1.2rem; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 5px; }

    .data-row { display: flex; justify-content: space-between; align-items: center; background: #222; padding: 10px; margin-bottom: 10px; border-radius: 5px; border-left: 4px solid var(--neon-cyan);}
    .data-row.reaction { border-left-color: var(--neon-pink); }
    .del-btn { background: #e53e3e; width: auto; margin: 0; padding: 5px 10px; font-size: 0.9rem;}
  </style>
</head>
<body>

  <div class="container" id="login-box">
    <h1>ADMIN LOGIN</h1>
    <input type="text" id="adminRoom" placeholder="Raum-Code (z.B. C640U)">
    <input type="password" id="adminPass" placeholder="Admin Passwort">
    <button onclick="loginAdmin()">EINLOGGEN</button>
  </div>

  <div class="container" id="admin-dashboard" style="display: none;">
    <h1>KONTROLLZENTRUM</h1>
    <p style="text-align: center; margin-bottom: 20px; color: #aaa;">Lösche Fehleingaben. Der Beamer aktualisiert sich live!</p>
    
    <div class="grid">
      <div class="list-section">
        <h2>🍺 Letzte Drinks</h2>
        <div id="drink-list"></div>
      </div>

      <div class="list-section">
        <h2>⚡ Letzte Tests</h2>
        <div id="reaction-list"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const client = supabase.createClient('https://usihbregbanpfspblrnw.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzaWhicmVnYmFucGZzcGJscm53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxMDkyNzEsImV4cCI6MjA4NzY4NTI3MX0.U_f2brykxMbegtddye-hpy0lcJgtEzl1AB9lQGpd5UY');
    let adminRoomId = null;
    // Lese den Raum-Code aus der URL, falls vorhanden, und trage ihn ins Feld ein
    const adminUrlParams = new URLSearchParams(window.location.search);
    const prefillRoom = adminUrlParams.get('room');
    if (prefillRoom) {
      document.getElementById('adminRoom').value = prefillRoom;
    }

    async function loginAdmin() {
      const room = document.getElementById('adminRoom').value.toUpperCase();
      const pass = document.getElementById('adminPass').value;
      const { data } = await client.from('party_rooms').select('id, admin_password').eq('room_code', room).single();
      
      if (!data || data.admin_password !== pass) { alert("Falsch!"); return; }

      adminRoomId = data.id;
      document.getElementById('login-box').style.display = 'none';
      document.getElementById('admin-dashboard').style.display = 'block';
      loadAllData();
    }

    function loadAllData() {
      loadDrinks();
      loadReactions();
    }

    async function loadDrinks() {
      const { data: drinks } = await client.from('party_drinks').select('*, party_users(display_name)').eq('room_id', adminRoomId).order('created_at', { ascending: false });
      const list = document.getElementById('drink-list');
      list.innerHTML = '';
      if(!drinks) return;

      drinks.forEach(d => {
        const div = document.createElement('div');
        div.className = 'data-row';
        div.innerHTML = `
          <div><strong>${d.party_users?.display_name || 'Unbekannt'}</strong><br><span style="color:#aaa; font-size:0.8rem;">${d.volume_ml}ml | ${d.alcohol_percent}%</span></div>
          <button class="del-btn" onclick="deleteEntry('party_drinks', '${d.id}')">X</button>
        `;
        list.appendChild(div);
      });
    }

    async function loadReactions() {
      const { data: reactions } = await client.from('party_reactions').select('*, party_users(display_name)').eq('room_id', adminRoomId).order('created_at', { ascending: false });
      const list = document.getElementById('reaction-list');
      list.innerHTML = '';
      if(!reactions) return;

      reactions.forEach(r => {
        const div = document.createElement('div');
        div.className = 'data-row reaction';
        div.innerHTML = `
          <div><strong>${r.party_users?.display_name || 'Unbekannt'}</strong><br><span style="color:#aaa; font-size:0.8rem;">${r.reaction_time_ms} ms (Stufe ${r.alcohol_bucket})</span></div>
          <button class="del-btn" onclick="deleteEntry('party_reactions', '${r.id}')">X</button>
        `;
        list.appendChild(div);
      });
    }

    async function deleteEntry(table, id) {
      if(!confirm("Eintrag wirklich löschen?")) return;
      
      const { error } = await client.from(table).delete().eq('id', id);
      
      if (error) {
        alert("Fehler beim Löschen: " + error.message);
        console.error(error);
      } else {
        // Lädt die Admin-Liste neu. (Beamer aktualisiert sich ab jetzt von selbst!)
        loadAllData();
      }
    }
  </script>
</body>
</html>
