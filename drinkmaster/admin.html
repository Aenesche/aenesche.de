<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drinkmaster - Control Panel</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --panel-bg: #1a1a1a;
      --neon-cyan: #00f3ff;
      --neon-pink: #ff00ea;
      --neon-red: #ff3333;
      --text-main: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .hidden { display: none !important; }

    h1 { font-size: 2.5rem; margin-bottom: 20px; text-transform: uppercase; text-align: center;}
    .neon-text { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); }

    /* Login Box */
    #login-section {
      display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1;
    }

    input {
      background: var(--panel-bg); border: 1px solid #333; color: white;
      padding: 15px; border-radius: 8px; font-size: 1.2rem;
      width: 100%; max-width: 350px; margin-bottom: 15px; text-align: center; outline: none;
    }
    input:focus { border-color: var(--neon-cyan); }

    .btn {
      background: transparent; color: white; border: 2px solid var(--neon-cyan);
      padding: 15px 30px; font-size: 1.2rem; border-radius: 8px; cursor: pointer;
      width: 100%; max-width: 350px; text-transform: uppercase;
    }
    .btn:active { background: var(--neon-cyan); color: black; }

    /* Dashboard Box */
    #dashboard-section {
      width: 100%; max-width: 800px; display: flex; flex-direction: column;
    }

    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid #333;
    }

    /* Tabellen-Design für die Drinks */
    .drink-list {
      background: var(--panel-bg); border-radius: 12px; border: 1px solid #333;
      overflow: hidden;
    }

    .drink-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 20px; border-bottom: 1px solid #333;
    }
    .drink-item:last-child { border-bottom: none; }

    .drink-info { display: flex; flex-direction: column; }
    .drink-name { font-weight: bold; font-size: 1.2rem; color: var(--neon-cyan); margin-bottom: 5px;}
    .drink-details { color: #aaa; font-size: 0.9rem; }

    .btn-delete {
      background: rgba(255, 51, 51, 0.1); color: var(--neon-red);
      border: 1px solid var(--neon-red); padding: 8px 15px; border-radius: 5px;
      cursor: pointer; font-weight: bold; transition: 0.2s;
    }
    .btn-delete:hover { background: var(--neon-red); color: white; box-shadow: 0 0 10px var(--neon-red); }

  </style>
</head>
<body>

  <div id="login-section">
    <h1>Control <span class="neon-text">Panel</span></h1>
    <p style="margin-bottom: 20px; color: #888;">Bitte logge dich als Host ein.</p>
    
    <input type="text" id="adminRoomInput" placeholder="Raum-Code (z.B. AB12C)" style="text-transform: uppercase;">
    <input type="password" id="adminPasswordInput" placeholder="Passwort">
    
    <button class="btn" onclick="loginAdmin()">Einloggen</button>
  </div>

  <div id="dashboard-section" class="hidden">
    <div class="header-bar">
      <h2>Raum: <span id="admin-room-display" class="neon-text">...</span></h2>
      <button class="btn" style="width: auto; padding: 10px 20px; font-size: 1rem; border-color: #555; color: #aaa;" onclick="logoutAdmin()">Logout</button>
    </div>

    <h3 style="margin-bottom: 15px; color: var(--neon-pink);">Letzte Einträge</h3>
    <div class="drink-list" id="drink-list-container">
      <p style="padding: 20px; color: #666; text-align: center;">Lade Daten...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
