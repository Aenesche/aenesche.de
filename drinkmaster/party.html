<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Drinkmaster - Party Mode</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --neon-cyan: #00f3ff;
      --neon-pink: #ff00ea;
      --panel-bg: #1a1a1a;
      --text-main: #ffffff;
    }
    

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 20px;
    }

    /* Hilfsklassen zum Ein-/Ausblenden */
    .hidden { display: none !important; }

    /* --- LOGIN BEREICH --- */
    #login-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
    }

    h1 { font-size: 2.5rem; margin-bottom: 20px; text-transform: uppercase; }
    .neon-text { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); }

    input {
      background: var(--panel-bg); border: 1px solid #333; color: white;
      padding: 15px; border-radius: 8px; font-size: 1.2rem;
      width: 100%; max-width: 350px; margin-bottom: 15px; text-align: center;
      outline: none;
    }
    input:focus { border-color: var(--neon-cyan); }

    .btn {
      background: transparent; color: white;
      border: 2px solid var(--neon-cyan); padding: 15px 30px;
      font-size: 1.2rem; border-radius: 8px; cursor: pointer;
      width: 100%; max-width: 350px; text-transform: uppercase;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2) inset;
    }
    .btn:active { background: var(--neon-cyan); color: black; }

    /* --- DASHBOARD BEREICH --- */
    #dashboard-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid #333;
    }

    .user-name { font-size: 1.5rem; color: var(--neon-pink); font-weight: bold; }
    
    .link-beamer {
      color: #aaa; text-decoration: none; font-size: 0.9rem;
      border: 1px solid #555; padding: 5px 10px; border-radius: 5px;
    }

    /* Slider Design */
    .slider-container {
      background: var(--panel-bg);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #333;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-size: 1.1rem;
    }

    .val-display { color: var(--neon-cyan); font-weight: bold; font-size: 1.3rem;}

    input[type=range] {
      -webkit-appearance: none; width: 100%; background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; height: 25px; width: 25px;
      border-radius: 50%; background: var(--neon-cyan);
      cursor: pointer; margin-top: -10px;
      box-shadow: 0 0 10px var(--neon-cyan);
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%; height: 5px; cursor: pointer;
      background: #444; border-radius: 5px;
    }

    /* Presets */
    .presets {
      display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px;
    }
    .preset-btn {
      background: #222; border: 1px solid #444; color: white;
      padding: 10px 15px; border-radius: 8px; white-space: nowrap;
    }

    .btn-submit {
      border-color: var(--neon-pink); color: var(--neon-pink);
      box-shadow: 0 0 15px rgba(255, 0, 234, 0.2) inset;
      margin-top: auto; font-weight: bold; font-size: 1.4rem; padding: 20px;
    }
    .btn-submit:active { background: var(--neon-pink); color: white; }

  </style>
</head>
<body>

  <div id="login-section">
    <h1>Join <span class="neon-text" id="room-display">...</span></h1>
    <p style="margin-bottom: 20px; color: #888;">Gib deinen Namen ein, um zu starten.</p>
    
    <input type="text" id="usernameInput" placeholder="Dein Name" autocomplete="off">
    <button class="btn" onclick="joinParty()">Let's Go</button>
  </div>

  <div id="dashboard-section" class="hidden">
    <div class="header-bar">
      <div class="user-name" id="display-name">Name</div>
      <a href="#" id="link-to-presentation" target="_blank" class="link-beamer">Live-Ansicht ansehen</a>
    </div>

    <div class="presets">
      <button class="preset-btn" onclick="setPreset(500, 4.9)">🍺 Großes Bier</button>
      <button class="preset-btn" onclick="setPreset(330, 4.9)">🍻 Kleines Bier</button>
      <button class="preset-btn" onclick="setPreset(40, 40)">🥃 Shot</button>
      <button class="preset-btn" onclick="setPreset(200, 12)">🍹 Mische (Normal)</button>
    </div>

    <div class="slider-container">
      <div class="slider-header">
        <span>Menge (ml)</span>
        <span class="val-display"><span id="vol-val">330</span> ml</span>
      </div>
      <input type="range" id="volumeSlider" min="10" max="1000" step="10" value="330" oninput="updateSliders()">
    </div>

    <div class="slider-container">
      <div class="slider-header">
        <span>Stärke (Vol%)</span>
        <span class="val-display" style="color: var(--neon-pink)"><span id="alc-val">4.9</span> %</span>
      </div>
      <input type="range" id="alcSlider" min="0" max="80" step="0.1" value="4.9" oninput="updateSliders()">
    </div>

    <button class="btn btn-submit" onclick="submitDrink()">DRINK EINTRAGEN</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="party.js"></script>
</body>
</html>
