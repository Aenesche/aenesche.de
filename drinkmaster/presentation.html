<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beamer Ansicht - Drinkmaster</title>
  <style>
    :root { --bg-color: #0d0d0d; --text-main: #ffffff; --neon-cyan: #00f3ff; --neon-pink: #ff00ea; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    .info-panel { width: 300px; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 2px solid #333; background: #111; z-index: 10; }
    .room-code-box { text-align: center; margin-bottom: 50px; }
    .room-code-box h3 { color: #888; font-weight: normal; margin-bottom: 10px; text-transform: uppercase;}
    .neon-text { color: var(--neon-cyan); font-size: 3.5rem; letter-spacing: 3px; font-weight: bold; text-shadow: 0 0 15px rgba(0, 243, 255, 0.5); }
    .qr-box { text-align: center; }
    .qr-box h3 { color: #888; font-weight: normal; margin-bottom: 15px; text-transform: uppercase; }
    #qrcode { background: white; padding: 15px; border-radius: 10px; display: inline-block;}

    .btn-toggle { background: transparent; color: var(--neon-pink); border: 2px solid var(--neon-pink); padding: 10px 20px; font-size: 1rem; border-radius: 8px; cursor: pointer; text-transform: uppercase; margin-top: 40px; box-shadow: 0 0 10px rgba(255,0,234,0.3); transition: 0.3s; font-weight: bold;}
    .btn-toggle:hover { background: var(--neon-pink); color: #000; box-shadow: 0 0 20px rgba(255,0,234,0.6); }

    .chart-area { 
      flex: 1; position: relative; display: flex; flex-direction: column; 
      justify-content: flex-end; padding: 40px; width: calc(100vw - 300px); 
    }

    #live-stats { 
      width: 100%; height: 80vh; display: flex; align-items: flex-end; 
      justify-content: flex-start; gap: 15px; 
      border-bottom: 2px solid #333; padding-bottom: 10px; 
      overflow-x: auto; overflow-y: hidden; 
    }
    
    #live-stats::-webkit-scrollbar { height: 12px; }
    #live-stats::-webkit-scrollbar-track { background: #111; border-radius: 6px; }
    #live-stats::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 6px; }

    .drink-block { border-radius: 4px; margin-bottom: 2px; transition: all 0.5s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.3) inset; }

    .player-column { 
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end; 
      flex: 0 0 auto; width: 130px; margin: 0 5px; height: 100%; position: relative; 
      padding-bottom: 120px; /* DER TRICK: Macht 120px Platz IN der Box für die Namen */
    }

    .player-tower { display: flex; flex-direction: column-reverse; width: 100%; align-items: center; }
    
    .player-score { font-size: 1.5rem; font-weight: bold; color: #fff; margin-bottom: 15px; text-shadow: 0 0 10px rgba(255,255,255,0.3); }

    .player-name { 
      font-weight: bold; color: #ccc; width: 130px; font-size: 1rem; 
      position: absolute; 
      bottom: 20px; /* Sitzt jetzt IN der Spalte, direkt über der Scrollbar */
      left: 20px; 
      transform: rotate(-45deg); 
      transform-origin: left bottom; 
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
    }
    #global-chart-container { display: none; width: 100%; height: 100%; padding-bottom: 20px; }
  </style>
</head>
<body>

  <div class="info-panel">
    <div class="room-code-box">
      <h3>Raum Code</h3>
      <div id="roomCodeDisplay" class="neon-text">...</div>
    </div>
    <div class="qr-box">
      <h3>Join Party</h3>
      <div id="qrcode"></div>
      <h3></h3>
      <h3>Site hosted on Aenesche.de</h3>
    </div>
    <button id="toggleViewBtn" class="btn-toggle" onclick="toggleView()">📊 Reaktionstests</button>
  </div>

  <div class="chart-area">
    <div id="live-stats"></div>
    <div id="global-chart-container">
      <canvas id="globalChart"></canvas>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="presentation.js"></script>
</body>
</html>
