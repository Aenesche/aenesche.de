<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beamer Ansicht - Drinkmaster</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --text-main: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Linke Spalte: Infos & QR */
    .info-panel {
      width: 300px;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-right: 2px solid #333; /* Die Y-Achse deines Diagramms */
      background: #111;
    }

    .room-code-box { text-align: center; margin-bottom: 50px; }
    .room-code-box h3 { color: #888; font-weight: normal; margin-bottom: 10px; text-transform: uppercase;}
    .neon-text { color: #00f3ff; font-size: 3.5rem; letter-spacing: 3px; font-weight: bold; text-shadow: 0 0 15px rgba(0, 243, 255, 0.5); }

    .qr-box { text-align: center; }
    .qr-box h3 { color: #888; font-weight: normal; margin-bottom: 15px; text-transform: uppercase; }
    #qrcode { background: white; padding: 15px; border-radius: 10px; display: inline-block;}

    /* Rechte Spalte: Das Diagramm */
    .chart-area {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 40px;
    }

    #live-stats {
      flex: 1;
      display: flex;
      align-items: flex-end; /* Baut die Türme von unten auf */
      justify-content: space-around;
      border-bottom: 2px solid #333; /* Die X-Achse deines Diagramms */
      padding-bottom: 1px; /* Damit die Blöcke exakt auf der Linie stehen */
    }

    /* Styling für die einzelnen Drink-Blöcke */
    .drink-block {
      width: 100%;
      border-radius: 4px;
      margin-bottom: 2px; /* Kleiner Spalt zwischen den Drinks */
      transition: all 0.5s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3) inset;
    }

    /* Container für einen Spieler */
    .player-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      width: 80px;
      height: 100%;
    }

    .player-tower {
      display: flex;
      flex-direction: column-reverse; /* WICHTIG: Erster Drink ist ganz unten! */
      width: 100%;
      align-items: center;
    }

    .player-name {
      margin-top: 15px;
      font-weight: bold;
      color: #ccc;
      text-align: center;
      width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .player-score {
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="info-panel">
    <div class="room-code-box">
      <h3>Raum Code</h3>
      <div id="roomCodeDisplay" class="neon-text">...</div>
    </div>
    
    <div class="qr-box">
      <h3>Join Party</h3>
      <div id="qrcode"></div>
    </div>
  </div>

  <div class="chart-area">
    <div id="live-stats">
      </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="presentation.js"></script>
</body>
</html>
