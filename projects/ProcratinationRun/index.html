<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aufgabenanalyse Speedrun // Deutsch Abi</title>
<style>
  :root {
    --bg: #0d0e10;
    --bg-elev: #15171b;
    --bg-elev-2: #1c1f24;
    --border: #2a2e35;
    --text: #e8e6df;
    --text-dim: #8a8780;
    --accent: #ff5722;
    --accent-2: #f5c518;
    --good: #4ade80;
    --bad: #ef4444;
    --warn: #fbbf24;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  body {
    padding: 16px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
    margin-bottom: 20px;
  }

  .title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .title .accent { color: var(--accent); }

  .meta {
    color: var(--text-dim);
    font-size: 12px;
  }

  /* Timer */
  .timer-bar {
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
    display: flex;
    gap: 16px;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }

  .timer {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent-2);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.05em;
  }

  .pb {
    font-size: 12px;
    color: var(--text-dim);
  }
  .pb b { color: var(--good); }

  .controls { margin-left: auto; display: flex; gap: 8px; }

  button.btn {
    background: var(--bg-elev);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 14px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    transition: all 0.1s;
  }
  button.btn:hover { background: var(--bg-elev-2); border-color: var(--accent); }
  button.btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  button.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
  button.btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Layout */
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
    gap: 20px;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* Task panel */
  .task {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    padding: 16px;
    height: fit-content;
    position: sticky;
    top: 70px;
    max-height: calc(100vh - 90px);
    overflow-y: auto;
  }
  .task h2 {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }
  .task .task-title {
    font-size: 14px;
    color: var(--accent-2);
    margin-bottom: 14px;
    font-weight: 600;
  }
  .task .task-body {
    font-size: 13px;
    color: var(--text);
    white-space: pre-wrap;
    line-height: 1.6;
    border-left: 2px solid var(--accent);
    padding-left: 12px;
    margin-bottom: 14px;
  }
  .task .materials {
    border-top: 1px dashed var(--border);
    padding-top: 12px;
  }
  .task .mat {
    margin-bottom: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .task .mat b { color: var(--text); }

  /* Attributes */
  .attrs h2 {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
    margin-top: 14px;
  }
  .attrs h2:first-child { margin-top: 0; }
  .attr-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 4px;
  }
  .attr {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 11px;
    padding: 6px 8px;
    cursor: pointer;
    text-align: left;
    transition: all 0.05s;
    user-select: none;
  }
  .attr:hover { background: var(--bg-elev-2); border-color: var(--accent); }
  .attr.on {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
    font-weight: 600;
  }
  .attr.review-correct {
    background: rgba(74, 222, 128, 0.15);
    border-color: var(--good);
    color: var(--good);
  }
  .attr.review-correct.on {
    background: var(--good);
    color: var(--bg);
  }
  .attr.review-missed {
    border-color: var(--good);
    color: var(--good);
    border-style: dashed;
  }
  .attr.review-wrong {
    background: rgba(239, 68, 68, 0.15);
    border-color: var(--bad);
    color: var(--bad);
  }

  /* Result modal */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .modal-bg.active { display: flex; }
  .modal {
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    padding: 24px;
    max-width: 500px;
    width: 100%;
  }
  .modal h2 {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }
  .modal .score {
    font-size: 56px;
    font-weight: 700;
    color: var(--accent-2);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    margin-bottom: 4px;
  }
  .modal .score-suffix {
    font-size: 24px;
    color: var(--text-dim);
  }
  .modal .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin: 16px 0;
    padding: 12px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .modal .stat-label {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .modal .stat-val {
    font-size: 18px;
    font-weight: 600;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  .modal .stat-val.good { color: var(--good); }
  .modal .stat-val.bad { color: var(--bad); }
  .modal .stat-val.warn { color: var(--warn); }
  .modal .verdict {
    margin: 12px 0;
    color: var(--text);
    font-size: 13px;
  }
  .modal .actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }

  /* Start screen */
  .start-screen {
    text-align: center;
    padding: 60px 20px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
  }
  .start-screen .ascii {
    color: var(--accent);
    font-size: 11px;
    line-height: 1.2;
    white-space: pre;
    margin-bottom: 20px;
  }
  .start-screen h1 {
    font-size: 24px;
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }
  .start-screen p {
    color: var(--text-dim);
    margin-bottom: 4px;
    font-size: 13px;
  }
  .start-screen .hint {
    color: var(--text-dim);
    margin: 16px auto;
    max-width: 500px;
    font-size: 12px;
    text-align: left;
    border-left: 2px solid var(--accent);
    padding: 8px 12px;
  }
  .start-screen .hint b { color: var(--accent-2); }
  .start-screen button {
    margin-top: 16px;
    font-size: 14px;
    padding: 10px 24px;
  }

  .blink { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
</style>
</head>
<body>

<div class="header">
  <div class="title"><span class="accent">▸</span> AUFGABENANALYSE_SPEEDRUN<span class="blink">_</span></div>
  <div class="meta">v1.0 // dt-abi-bln // by aenesche</div>
</div>

<div id="app"></div>

<!-- Result Modal -->
<div class="modal-bg" id="modalBg">

    <h2>// run complete</h2>

    <div class="verdict" id="resVerdict"></div>
    <div class="stats">
      <div>
        <div class="stat-label">Time</div>
        <div class="stat-val" id="resTime">0:00</div>
      </div>
      <div>
        <div class="stat-label">Hits</div>
        <div class="stat-val good" id="resHits">0/0</div>
      </div>
      <div>
        <div class="stat-label">Wrong</div>
        <div class="stat-val bad" id="resWrong">0</div>
      </div>
    </div>
    <div class="meta" id="resPb"></div>
    <div class="actions">
      <button class="btn" onclick="reviewMode()">Review</button>
      <button class="btn primary" onclick="startNewRun()">Next Run ▸</button>
    </div>
  </div>
</div>

// =====================================================
// STATE
// =====================================================
let state = {
  currentTask: null,
  selected: new Set(),
  startTime: null,
  timerInterval: null,
  finished: false,
  reviewing: false
};

// =====================================================
// RENDERING
// =====================================================
function renderStart() {
  const pb = getPB();
  const pbStr = pb ? `<b>${pb.score}%</b> @ ${formatTime(pb.time)}` : "noch keine";
  document.getElementById('app').innerHTML = `
    <div class="start-screen">
      <pre class="ascii">    █▀▀ █▀█ █▀▀ █▀▀ █▀▄ █▀█ █ █ █▄ █
    ▄██ █▀▀ ██▄ ██▄ █▄▀ █▀▄ █▄█ █ ▀█</pre>
      <h1>Aufgabenanalyse // Speedrun</h1>
      <p>10 zufällige Aufgaben „materialgestütztes Schreiben"</p>
      <p>Identifiziere die Attribute. So schnell wie möglich. So genau wie möglich.</p>
      <div class="hint">
        <b>So spielst du:</b><br>
        ▸ Du bekommst eine zufällige Aufgabe + Materialien<br>
        ▸ Klicke alle zutreffenden Attribute an (Aufgabentyp, Textsorte, Adressat, Themen, Materialpositionen, Stil)<br>
        ▸ Drücke <b>FINISH</b> wenn fertig<br>
        ▸ Score = % der korrekt erkannten Attribute (Falschklicks ziehen ab)<br>
        ▸ Timer läuft mit – Personal Best wird gespeichert
      </div>
      <p style="color: var(--text-dim); font-size: 12px;">Personal Best: ${pbStr}</p>
      <button class="btn primary" onclick="startNewRun()">▸ START RUN</button>
    </div>
  `;
}

function renderRun() {
  const t = state.currentTask;
  document.getElementById('app').innerHTML = `
    <div class="timer-bar">
      <div class="timer" id="timer">0:00.0</div>
      <div class="pb">PB: ${formatPB()}</div>
      <div class="controls">
        <button class="btn" onclick="abortRun()">Abort</button>
        <button class="btn primary" onclick="finishRun()">Finish ▸</button>
      </div>
    </div>
    <div class="layout">
      <div class="task">
        <h2>// task #${t.id}</h2>
        <div class="task-title">${t.title}</div>
        <div class="task-body">${t.body}</div>
        <div class="materials">
          <h2 style="margin-bottom:8px;">// materialien</h2>
          ${t.materials.map(m => `<div class="mat"><b>${m.id}:</b> ${m.desc}</div>`).join('')}
        </div>
      </div>
      <div class="attrs" id="attrs"></div>
    </div>
  `;
  renderAttrs();
}

function renderAttrs() {
  const html = ATTR_GROUPS.map(group => {
    const buttons = group.attrs.map(a => {
      const on = state.selected.has(a.id) ? 'on' : '';
      return `<button class="attr ${on}" data-id="${a.id}" onclick="toggleAttr('${a.id}')">${a.label}</button>`;
    }).join('');
    return `<h2>${group.label}</h2><div class="attr-grid">${buttons}</div>`;
  }).join('');
  document.getElementById('attrs').innerHTML = html;
}

function renderReview() {
  state.reviewing = true;
  const correct = new Set(state.currentTask.correct);
  document.getElementById('modalBg').classList.remove('active');
  // Re-render attrs with review classes
  const html = ATTR_GROUPS.map(group => {
    const buttons = group.attrs.map(a => {
      const isCorrect = correct.has(a.id);
      const isSelected = state.selected.has(a.id);
      let cls = '';
      if (isCorrect && isSelected) cls = 'review-correct on';
      else if (isCorrect && !isSelected) cls = 'review-missed';
      else if (!isCorrect && isSelected) cls = 'review-wrong on';
      return `<button class="attr ${cls}" data-id="${a.id}">${a.label}</button>`;
    }).join('');
    return `<h2>${group.label}</h2><div class="attr-grid">${buttons}</div>`;
  }).join('');
  document.getElementById('attrs').innerHTML = html;

  // Replace timer bar with review bar
  document.querySelector('.timer-bar').innerHTML = `
    <div class="timer" style="font-size:18px;color:var(--text);">REVIEW MODE</div>
    <div class="pb"><span style="color:var(--good);">■</span> hit &nbsp; <span style="color:var(--good);border:1px dashed var(--good);padding:0 4px;">□</span> missed &nbsp; <span style="color:var(--bad);">■</span> wrong</div>
    <div class="controls">
      <button class="btn primary" onclick="startNewRun()">Next Run ▸</button>
    </div>
  `;
}

// =====================================================
// LOGIC
// =====================================================
function startNewRun() {
  // Pick task that is different from last one if possible
  let pool = TASKS.slice();
  const last = state.currentTask?.id;
  if (last) pool = pool.filter(t => t.id !== last);
  state.currentTask = pool[Math.floor(Math.random() * pool.length)];
  state.selected = new Set();
  state.finished = false;
  state.reviewing = false;
  state.startTime = performance.now();
  document.getElementById('modalBg').classList.remove('active');
  renderRun();
  startTimer();
}

function toggleAttr(id) {
  if (state.finished) return;
  if (state.selected.has(id)) state.selected.delete(id);
  else state.selected.add(id);
  // Update single button
  const btn = document.querySelector(`[data-id="${id}"]`);
  if (btn) btn.classList.toggle('on');
}

function startTimer() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(updateTimer, 50);
}

function updateTimer() {
  const el = document.getElementById('timer');
  if (!el) return;
  const elapsed = (performance.now() - state.startTime) / 1000;
  el.textContent = formatTime(elapsed);
}

function stopTimer() {
  if (state.timerInterval) clearInterval(state.timerInterval);
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  const ms = Math.floor((sec % 1) * 10);
  return `${m}:${s.toString().padStart(2, '0')}.${ms}`;
}

function finishRun() {
  if (state.finished) return;
  state.finished = true;
  stopTimer();
  const elapsed = (performance.now() - state.startTime) / 1000;

  const correct = new Set(state.currentTask.correct);
  let hits = 0, wrongs = 0;
  state.selected.forEach(id => {
    if (correct.has(id)) hits++;
    else wrongs++;
  });
  const total = correct.size;
  const missed = total - hits;

  // Score: hits/total minus penalty for wrongs (capped at 0)
  // Each wrong = -5% of total possible
  let score = (hits / total) * 100 - wrongs * (100 / total);
  score = Math.max(0, Math.round(score));

  showResult({ score, time: elapsed, hits, total, wrongs, missed });
}

function showResult(r) {
  document.getElementById('resScore').textContent = r.score;
  document.getElementById('resTime').textContent = formatTime(r.time);
  document.getElementById('resHits').textContent = `${r.hits}/${r.total}`;
  document.getElementById('resWrong').textContent = r.wrongs;

  let verdict;
  if (r.score === 100 && r.wrongs === 0) verdict = "▸ FLAWLESS RUN. Aufgabenanalyse perfekt.";
  else if (r.score >= 90) verdict = "▸ Excellent. Bist abi-ready für diese Aufgabe.";
  else if (r.score >= 75) verdict = "▸ Solide. Ein paar Details übersehen.";
  else if (r.score >= 50) verdict = "▸ Geht so. Aufgabenstellung beim nächsten Mal genauer lesen.";
  else verdict = "▸ Autsch. Aufgabenanalyse nochmal üben.";
  document.getElementById('resVerdict').textContent = verdict;

  // Personal best logic: best score, tiebreaker: faster time
  const pb = getPB();
  let pbStr = "";
  let isNewPB = false;
  if (!pb || r.score > pb.score || (r.score === pb.score && r.time < pb.time)) {
    setPB({ score: r.score, time: r.time });
    isNewPB = true;
    pbStr = `<span style="color:var(--accent-2);">★ NEW PERSONAL BEST</span>`;
  } else {
    pbStr = `Personal Best: <b>${pb.score}%</b> @ ${formatTime(pb.time)}`;
  }
  document.getElementById('resPb').innerHTML = pbStr;

  document.getElementById('modalBg').classList.add('active');
}

function reviewMode() {
  renderReview();
}

function abortRun() {
  if (!confirm("Run abbrechen? Fortschritt geht verloren.")) return;
  stopTimer();
  state.currentTask = null;
  renderStart();
}

// =====================================================
// PERSISTENCE (in-memory only – localStorage not allowed)
// =====================================================
let _pb = null;
function getPB() { return _pb; }
function setPB(v) { _pb = v; }
function formatPB() {
  const pb = getPB();
  return pb ? `${pb.score}% @ ${formatTime(pb.time)}` : "—";
}

// =====================================================
// BOOT
// =====================================================
renderStart();
</script>
