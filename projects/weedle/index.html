<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background-color: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    </style>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        backgroundColor: '#050505', // Deep Black
        scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);
    let player;
    let cursors;

    function preload() {}

    // Kopiere diesen Teil in deine create-Funktion
function create() {
    // 1. Physik-Gruppe für Wände
    this.walls = this.physics.add.staticGroup();

    // 2. Boden zeichnen (Parallelogramm-Grid)
    const floor = this.add.graphics();
    floor.lineStyle(1, 0x1a1a1a, 1);
    for(let i = 0; i < 20; i++) {
        floor.moveTo(0, i * 40);
        floor.lineTo(800, i * 40 + 100); // Der Versatz erzeugt das Parallelogramm
        floor.strokePath();
    }

    // 3. Eine Wand bauen (Funktion unten definiert)
    createWall(this, 100, 100, 300, 20); // Horizontale Wand
    createWall(this, 100, 100, 20, 200); // Vertikale Wand

    // 4. Der Player (Neon-Bot)
    this.player = this.add.container(400, 300);
    this.physics.world.enable(this.player);
    this.player.body.setCollideWorldBounds(true);
    
    // Player Visuals
    let body = this.add.graphics();
    body.lineStyle(2, 0x00ff00, 1);
    body.strokeRect(-15, -15, 30, 30); // Äußerer Rahmen
    body.fillStyle(0x00ff00, 0.5);
    body.fillRect(-5, -5, 10, 10);    // Leuchtender Kern
    this.player.add(body);

    // Kollisionen aktivieren
    this.physics.add.collider(this.player, this.walls);

    // Steuerung
    this.keys = this.input.keyboard.addKeys('W,A,S,D');
}

function update() {
    let speed = 200;
    this.player.body.setVelocity(0);

    if (this.keys.A.isDown) this.player.body.setVelocityX(-speed);
    if (this.keys.D.isDown) this.player.body.setVelocityX(speed);
    if (this.keys.W.isDown) this.player.body.setVelocityY(-speed);
    if (this.keys.S.isDown) this.player.body.setVelocityY(speed);
}

// Hilfsfunktion für Neon-Wände mit Kollision
function createWall(scene, x, y, w, h) {
    let wall = scene.add.graphics();
    // Tiefen-Effekt (3D-Look)
    wall.lineStyle(2, 0x00ffff, 1);
    wall.strokeRect(x, y, w, h);
    wall.lineStyle(1, 0x00ffff, 0.3);
    wall.strokeRect(x, y - 10, w, h); // Die "Oberkante" der Wand
    
    // Physik-Körper hinzufügen
    let zone = scene.add.zone(x + w/2, y + h/2, w, h);
    scene.walls.add(zone);
}

    function drawIsoTile(g, x, y, size) {
        g.beginPath();
        g.moveTo(x, y);
        g.lineTo(x + size, y + size / 2);
        g.lineTo(x, y + size);
        g.lineTo(x - size, y + size / 2);
        g.closePath();
        g.strokePath();
    }

    function createNeonStation(scene, x, y, color) {
        let g = scene.add.graphics();
        // Glow-Effekt durch mehrere Schichten
        for(let i = 5; i > 0; i--) {
            g.lineStyle(i * 2, color, 0.1);
            drawIsoTile(g, x, y, 40);
        }
        g.lineStyle(2, color, 1);
        drawIsoTile(g, x, y, 40);
        
        scene.add.text(x - 20, y - 40, "STATION", { font: "12px Arial", fill: "#fff" });
    }
</script>
</body>
</html>
