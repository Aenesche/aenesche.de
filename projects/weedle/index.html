<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Weedle - Neon Prototyp</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    </style>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        backgroundColor: '#050505',
        // HIER WAR DER FEHLER: Physics muss aktiviert sein!
        physics: {
            default: 'arcade',
            arcade: { debug: false } 
        },
        scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);
    let player;
    let playerEyes;
    let keys;
    let walls;

    function preload() {}

    function create() {
        // 1. Physik-Gruppe für Wände und Tische
        walls = this.physics.add.staticGroup();

        // 2. Neon-Boden zeichnen (Parallelogramm-Grid)
        const floor = this.add.graphics();
        floor.lineStyle(1, 0x003333, 0.4); // Dunkles Neon-Cyan
        
        // Vertikale Linien (leicht schräg für den Tiefeneffekt)
        for(let x = 0; x <= 1000; x += 40) {
            floor.moveTo(x, 0);
            floor.lineTo(x - 300, 600); 
        }
        // Horizontale Linien
        for(let y = 0; y <= 600; y += 40) {
            floor.moveTo(0, y);
            floor.lineTo(800, y);
        }
        floor.strokePath();

        // 3. Wände bauen (x, y, breite, höhe)
        createWall(this, 150, 100, 500, 20); // Obere Wand
        createWall(this, 150, 100, 20, 400); // Linke Wand
        createWall(this, 150, 480, 500, 20); // Untere Wand
        createWall(this, 630, 100, 20, 400); // Rechte Wand

        // Ein Tisch in der Mitte
        createTable(this, 350, 250, 100, 60);

        // 4. Der Player (Neon-Bot)
        player = this.add.container(400, 300);
        this.physics.world.enable(player);
        player.body.setCollideWorldBounds(true);
        player.body.setSize(24, 24); // Hitbox
        player.body.setOffset(-12, -12); // Hitbox zentrieren

        // Player Visuals (Körper)
        let playerBody = this.add.graphics();
        playerBody.lineStyle(2, 0x00ff00, 1);
        playerBody.strokeRect(-12, -12, 24, 24);
        playerBody.fillStyle(0x002200, 0.8);
        playerBody.fillRect(-12, -12, 24, 24);
        player.add(playerBody);

        // Player Visuals (Augen)
        playerEyes = this.add.graphics();
        playerEyes.fillStyle(0x00ff00, 1);
        playerEyes.fillRect(-6, 4, 4, 4); // Linkes Auge
        playerEyes.fillRect(2, 4, 4, 4);  // Rechtes Auge
        player.add(playerEyes);

        // Kollision aktivieren!
        this.physics.add.collider(player, walls);

        // Steuerung
        keys = this.input.keyboard.addKeys('W,A,S,D');
    }

    function update() {
        let speed = 200;
        player.body.setVelocity(0);

        let movingX = 0;
        let movingY = 0;

        if (keys.A.isDown) movingX = -1;
        if (keys.D.isDown) movingX = 1;
        if (keys.W.isDown) movingY = -1;
        if (keys.S.isDown) movingY = 1;

        // Diagonales Laufen fixen (damit man nicht doppelt so schnell ist)
        if (movingX !== 0 && movingY !== 0) {
            movingX *= 0.7071;
            movingY *= 0.7071;
        }

        player.body.setVelocityX(movingX * speed);
        player.body.setVelocityY(movingY * speed);

        // Augen in Laufrichtung drehen
        if (movingX !== 0 || movingY !== 0) {
            let angle = Math.atan2(movingY, movingX);
            playerEyes.rotation = angle - Math.PI / 2; // - 90 Grad, da die Augen "nach unten" gezeichnet wurden
        }
    }

    // --- HILFSFUNKTIONEN FÜR DIE GRAFIK ---

    function createWall(scene, x, y, w, h) {
        let wallVisual = scene.add.graphics();
        
        // Feste Basis
        wallVisual.fillStyle(0x000000, 1);
        wallVisual.fillRect(x, y, w, h);
        
        // Leuchtende Kanten
        wallVisual.lineStyle(2, 0x00ffff, 1);
        wallVisual.strokeRect(x, y, w, h);
        
        // 3D/Tiefen-Effekt (Oberkante schräg nach hinten)
        wallVisual.lineStyle(1, 0x00ffff, 0.4);
        wallVisual.strokeRect(x + 10, y - 15, w, h); 
        wallVisual.beginPath();
        wallVisual.moveTo(x, y); wallVisual.lineTo(x + 10, y - 15);
        wallVisual.moveTo(x + w, y); wallVisual.lineTo(x + w + 10, y - 15);
        wallVisual.moveTo(x, y + h); wallVisual.lineTo(x + 10, y + h - 15);
        wallVisual.moveTo(x + w, y + h); wallVisual.lineTo(x + w + 10, y + h - 15);
        wallVisual.strokePath();

        // Physik-Hitbox erstellen
        let zone = scene.add.zone(x + w/2, y + h/2, w, h);
        scene.physics.add.existing(zone, true); // true = static
        walls.add(zone);
    }

    function createTable(scene, x, y, w, h) {
        let tableVisual = scene.add.graphics();
        
        // Glasfläche (transparent)
        tableVisual.fillStyle(0xff00ff, 0.1); 
        tableVisual.fillRect(x, y, w, h);
        
        // Leuchtender Rahmen
        tableVisual.lineStyle(2, 0xff00ff, 1);
        tableVisual.strokeRect(x, y, w, h);

        // Physik-Hitbox erstellen
        let zone = scene.add.zone(x + w/2, y + h/2, w, h);
        scene.physics.add.existing(zone, true);
        walls.add(zone);
    }
</script>
</body>
</html>
