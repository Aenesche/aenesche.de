<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Weedle - Neon Prototyp 3.0 (Perspektive)</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    </style>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        backgroundColor: '#050505',
        physics: {
            default: 'arcade',
            arcade: { debug: false } 
        },
        scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);
    let player;
    let playerEyes;
    let keys;
    let walls;

    // Fluchtpunkt und Grenzen für die Perspektive
    const BodenVorn = { y: 550, breite: 700 }; // Vordere Kante (Eingang)
    const BodenHinten = { y: 200, breite: 300 }; // Hintere Kante

    function preload() {}

    function create() {
        walls = this.physics.add.staticGroup();

        // 1. Neon-Boden zeichnen (Perspektivisches Zentralgitter)
        const floor = this.add.graphics();
        floor.lineStyle(1, 0x003333, 0.4); 
        
        // Gitter zeichnen
        const gitterAnzahl = 10;
        for(let i = 0; i <= gitterAnzahl; i++) {
            let xVorn = (400 - BodenVorn.breite / 2) + (i / gitterAnzahl) * BodenVorn.breite;
            let xHinten = (400 - BodenHinten.breite / 2) + (i / gitterAnzahl) * BodenHinten.breite;
            floor.moveTo(xVorn, BodenVorn.y);
            floor.lineTo(xHinten, BodenHinten.y);
        }
        for(let y = BodenHinten.y; y <= BodenVorn.y; y += 40) {
            let p = (y - BodenHinten.y) / (BodenVorn.y - BodenHinten.y);
            let breite = BodenHinten.breite + p * (BodenVorn.breite - BodenHinten.breite);
            floor.moveTo(400 - breite / 2, y);
            floor.lineTo(400 + breite / 2, y);
        }
        floor.strokePath();

        // 2. Perspektivische Wände zeichnen
        let wallVisuals = this.add.graphics();
        wallVisuals.lineStyle(2, 0x00ffff, 1);
        
        // Linke Wand Form
        let ptsLeft = [
            {x: 400 - BodenVorn.breite / 2, y: BodenVorn.y},
            {x: 400 - BodenHinten.breite / 2, y: BodenHinten.y},
            {x: 400 - BodenHinten.breite / 2, y: BodenHinten.y - 100},
            {x: 400 - BodenVorn.breite / 2, y: BodenVorn.y - 150}
        ];
        drawPoly(wallVisuals, ptsLeft);
        drawDepthLines(wallVisuals, ptsLeft[0].x, ptsLeft[0].y, ptsLeft[1].x, ptsLeft[1].y, 150, 100);

        // Rechte Wand Form
        let ptsRight = [
            {x: 400 + BodenVorn.breite / 2, y: BodenVorn.y},
            {x: 400 + BodenHinten.breite / 2, y: BodenHinten.y},
            {x: 400 + BodenHinten.breite / 2, y: BodenHinten.y - 100},
            {x: 400 + BodenVorn.breite / 2, y: BodenVorn.y - 150}
        ];
        drawPoly(wallVisuals, ptsRight);
        drawDepthLines(wallVisuals, ptsRight[0].x, ptsRight[0].y, ptsRight[1].x, ptsRight[1].y, 150, 100);

        // Hintere Wand
        wallVisuals.strokeRect(400 - BodenHinten.breite / 2, BodenHinten.y - 100, BodenHinten.breite, 100);
        wallVisuals.fillStyle(0x00ffff, 0.05);
        wallVisuals.fillRect(400 - BodenHinten.breite / 2, BodenHinten.y - 100, BodenHinten.breite, 100);

        // Eingangslinie
        wallVisuals.lineStyle(2, 0x444444, 1); 
        wallVisuals.moveTo(400 - BodenVorn.breite / 2, BodenVorn.y);
        wallVisuals.lineTo(400 + BodenVorn.breite / 2, BodenVorn.y);
        wallVisuals.strokePath();

        // 3. Tisch (Normale Arcade-Kollision reicht hier, da er mittig steht)
        createTable(this, 400, 350, 80, 50, 0xff00ff);

        // 4. Player
        player = this.add.container(400, 450);
        this.physics.world.enable(player);
        player.body.setSize(24, 24);
        player.body.setOffset(-12, -12);

        // Player Optik
        let playerBody = this.add.graphics();
        playerBody.lineStyle(2, 0x00ff00, 1);
        playerBody.strokeRect(-12, -12, 24, 24);
        playerBody.fillStyle(0x002200, 0.8);
        playerBody.fillRect(-12, -12, 24, 24);
        player.add(playerBody);

        playerEyes = this.add.graphics();
        playerEyes.fillStyle(0x00ff00, 1);
        playerEyes.fillRect(-6, -10, 4, 4);
        playerEyes.fillRect(2, -10, 4, 4); 
        player.add(playerEyes);

        // Nur Tisch-Kollision (Wände berechnen wir unten)
        this.physics.add.collider(player, walls);

        keys = this.input.keyboard.addKeys('W,A,S,D');
    }

    function update() {
        let speed = 200;
        let movingX = 0;
        let movingY = 0;

        if (keys.A.isDown) movingX = -1;
        if (keys.D.isDown) movingX = 1;
        if (keys.W.isDown) movingY = -1;
        if (keys.S.isDown) movingY = 1;

        if (movingX !== 0 && movingY !== 0) {
            movingX *= 0.7071;
            movingY *= 0.7071;
        }

        player.body.setVelocityX(movingX * speed);
        player.body.setVelocityY(movingY * speed);

        if (movingX !== 0 || movingY !== 0) {
            let angle = Math.atan2(movingY, movingX);
            playerEyes.rotation = angle - Math.PI / 2; 
        } else {
            playerEyes.rotation = 0;
        }

        // --- DER TRICK: Mathematische "Wände" für die Perspektive ---
        let playerRadius = 12;

        // 1. Oben und unten einsperren
        if (player.y < BodenHinten.y + playerRadius) player.y = BodenHinten.y + playerRadius;
        if (player.y > BodenVorn.y - playerRadius) player.y = BodenVorn.y - playerRadius;

        // 2. Die schrägen Seitenwände berechnen (je nachdem wie tief man im Raum steht)
        let prozentTief = (player.y - BodenHinten.y) / (BodenVorn.y - BodenHinten.y);
        
        let linkeWandX = (400 - BodenHinten.breite / 2) + prozentTief * ((400 - BodenVorn.breite / 2) - (400 - BodenHinten.breite / 2));
        let rechteWandX = 800 - linkeWandX;

        if (player.x < linkeWandX + playerRadius) player.x = linkeWandX + playerRadius;
        if (player.x > rechteWandX - playerRadius) player.x = rechteWandX - playerRadius;
    }

    // --- HILFSFUNKTIONEN ---

    function drawPoly(g, points) {
        g.beginPath();
        g.moveTo(points[0].x, points[0].y);
        for(let i = 1; i < points.length; i++) {
            g.lineTo(points[i].x, points[i].y);
        }
        g.closePath();
        g.strokePath();
    }

    function drawDepthLines(g, xVorn, yVorn, xHinten, yHinten, hVorn, hHinten) {
        g.beginPath();
        g.lineStyle(1, 0x00ffff, 0.4);
        for(let i = 0; i < 8; i++) {
            let p = i / 7;
            let x = xHinten + p * (xVorn - xHinten);
            let y = yHinten + p * (yVorn - yHinten);
            let h = hHinten + p * (hVorn - hHinten);
            g.moveTo(x, y);
            g.lineTo(x, y - h);
        }
        g.strokePath();
    }

    function createTable(scene, x, y, w, h, color) {
        let tableVisual = scene.add.graphics();
        tableVisual.fillStyle(color, 0.1); 
        tableVisual.fillRect(x - w/2, y - h/2, w, h);
        tableVisual.lineStyle(2, color, 1);
        tableVisual.strokeRect(x - w/2, y - h/2, w, h);

        let zone = scene.add.zone(x, y, w, h);
        scene.physics.add.existing(zone, true);
        walls.add(zone);
    }
</script>
</body>
</html>
