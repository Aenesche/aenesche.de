<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weed Tycoon</title>
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #mobile-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e0e0e0;
      text-align: center;
      padding: 2rem;
    }
    #mobile-overlay h2 {
      color: #4ade80;
      font-size: 1.6rem;
      margin-bottom: 1rem;
    }
    #mobile-overlay p {
      font-size: 1rem;
      margin-bottom: 2rem;
      max-width: 400px;
      line-height: 1.5;
    }
    #mobile-overlay button {
      background: #4ade80;
      color: #0a0a0a;
      border: none;
      padding: 0.8rem 2rem;
      font-size: 1.1rem;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
    }
    #mobile-overlay button:hover { background: #22c55e; }
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      z-index: 9998;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #4ade80;
    }
    #loading-screen h1 { font-size: 2.5rem; margin-bottom: 1.2rem; font-weight: 700; }
    #loading-bar-outer {
      width: 300px; height: 12px;
      border: 1px solid #4ade8066;
      border-radius: 8px;
      overflow: hidden;
      background: #1a1a2e;
    }
    #loading-bar-inner {
      width: 0%; height: 100%;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      border-radius: 8px;
      transition: width 0.2s;
    }
  </style>

</head>
<body>

  <div id="mobile-overlay">
    <h2>📱 Ey, kurz Heads-up</h2>
    <p>Weed Tycoon läuft am besten auf nem iPad oder PC. Auf dem Handy geht's, aber wird eng.</p>
    <button id="mobile-dismiss">Trotzdem spielen 🌿</button>
  </div>

  <div id="loading-screen">
    <h1>🌿 WEED TYCOON</h1>
    <div id="loading-bar-outer">
      <div id="loading-bar-inner"></div>
    </div>
    <p style="margin-top: 0.5rem; font-size: 0.8rem; color: #666;">Lädt...</p>
  </div>

  <div id="game-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Data (loaded as globals before game starts) -->
  <script src="data/worlds.js"></script>
  <script src="data/products.js"></script>
  <script src="data/upgrades.js"></script>
  <script src="data/npcs.js"></script>
  <script src="data/balance.js"></script>

  <!-- Systems -->
  <script src="systems/AudioSystem.js"></script>
  <script src="systems/EconomySystem.js"></script>
  <script src="systems/UpgradeSystem.js"></script>
  <script src="systems/PoliceSystem.js"></script>
  <script src="systems/SaveSystem.js"></script>

  <!-- Entities -->
  <script src="entities/Player.js"></script>
  <script src="entities/NPC.js"></script>
  <script src="entities/Building.js"></script>
  <script src="entities/buildings/GrowTent.js"></script>
  <script src="entities/buildings/Lamp.js"></script>
  <script src="entities/buildings/LaundryShop.js"></script>

  <!-- Scenes -->
  <script src="scenes/BootScene.js"></script>
  <script src="scenes/LoginScene.js"></script>
  <script src="scenes/MainMenuScene.js"></script>
  <script src="scenes/HUDScene.js"></script>
  <script src="scenes/SettingsScene.js"></script>
  <script src="scenes/worlds/PlantationScene.js"></script>
  <script src="scenes/worlds/LaundryScene.js"></script>
  <script src="scenes/worlds/LabScene.js"></script>

  <!-- Game Entry -->
  <script src="game.js"></script>

</body>
</html>
