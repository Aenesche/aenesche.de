<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Weedle - Logic Build v1</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    </style>
</head>
<body>
<script>

// --- KONSTANTEN ---
const TILE_SIZE = 40;
const OFFSET_X = 500;
const OFFSET_Y = 150;

// --- HILFSFUNKTION: Isometrische Position ---
function getIsoPos(gx, gy) {
    return {
        x: OFFSET_X + (gx - gy) * TILE_SIZE,
        y: OFFSET_Y + (gx + gy) * (TILE_SIZE / 2)
    };
}

// --- KLASSE: ITEM ---
class Item extends Phaser.GameObjects.Container {
    constructor(scene, type) {
        super(scene, 0, 0);
        this.type = type; // "seed" oder "plant"
        
        let g = scene.add.graphics();
        if (type === "seed") {
            g.lineStyle(2, 0xffff00, 1);
            g.strokeEllipse(0, 0, 12, 6);
            g.fillStyle(0xffff00, 1);
            g.fillCircle(0, 0, 2);
        } else {
            // Pflanze/Produkt (Grüner Kristall)
            g.lineStyle(2, 0x00ff00, 1);
            g.strokeRect(-6, -6, 12, 12);
        }
        this.add(g);
        scene.add.existing(this);
    }
}

// --- KLASSE: PLAYER ---
class Player extends Phaser.GameObjects.Container {
    constructor(scene, x, y) {
        super(scene, x, y);
        this.scene = scene;
        this.heldItem = null;

        // Visuals
        this.bodyGfx = scene.add.graphics();
        this.bodyGfx.lineStyle(2, 0x00ff00, 1);
        this.bodyGfx.fillStyle(0x003300, 0.8);
        this.bodyGfx.strokeRect(-12, -24, 24, 24);
        this.bodyGfx.fillRect(-12, -24, 24, 24);
        this.add(this.bodyGfx);

        // Augen
        this.eyes = scene.add.graphics();
        this.eyes.fillStyle(0x00ff00, 1);
        this.eyes.fillRect(-6, -14, 4, 4);
        this.eyes.fillRect(2, -14, 4, 4);
        this.add(this.eyes);

        scene.add.existing(this);
        scene.physics.world.enable(this);
        this.body.setCollideWorldBounds(true);
        this.body.setSize(24, 24).setOffset(-12, -12);
    }

    update(keys) {
        let speed = 200;
        let vx = 0, vy = 0;

        if (keys.A.isDown) vx = -1;
        if (keys.D.isDown) vx = 1;
        if (keys.W.isDown) vy = -1;
        if (keys.S.isDown) vy = 1;

        if (vx !== 0 && vy !== 0) { vx *= 0.707; vy *= 0.707; }

        this.body.setVelocity(vx * speed, vy * speed);

        // Augen-Animation
        let targetX = vx * 4;
        let targetY = vy * 4 - 14;
        this.eyes.x += (targetX - this.eyes.x) * 0.2;
        this.eyes.y += (targetY - this.eyes.y) * 0.2;

        return (vx !== 0 || vy !== 0); // Gibt zurück, ob wir uns bewegen
    }

    pickup(item) {
        if (this.heldItem) return;
        this.heldItem = item;
        item.setPosition(0, -40); // Über dem Kopf
        this.add(item);
    }

    drop() {
        if (!this.heldItem) return null;
        let item = this.heldItem;
        this.heldItem = null;
        this.remove(item);
        return item;
    }
}

// --- SZENE ---
class MainScene extends Phaser.Scene {
    constructor() { super("MainScene"); }

    create() {
        this.keys = this.input.keyboard.addKeys('W,A,S,D,E');
        this.interactables = this.physics.add.staticGroup();

        // Boden zeichnen
        let bg = this.add.graphics();
        bg.lineStyle(1, 0x002222, 0.5);
        for(let i=0; i<=10; i++) {
            for(let j=0; j<=10; j++) {
                let p = getIsoPos(i, j);
                bg.beginPath(); bg.moveTo(p.x, p.y); bg.lineTo(p.x+TILE_SIZE, p.y+TILE_SIZE/2);
                bg.lineTo(p.x, p.y+TILE_SIZE); bg.lineTo(p.x-TILE_SIZE, p.y+TILE_SIZE/2); bg.closePath(); bg.strokePath();
            }
        }

        // --- STATIONEN SETUP ---
        
        // 1. Samen-Terminal (Kaufen)
        this.createStation(2, 2, "seed_shop", 0xffaa00, "SAMEN SHOP (E halten)");
        
        // 2. Lager-Tisch (Ablegen)
        this.createStation(5, 5, "storage", 0x00ffff, "LAGER (E)");

        // 3. Beet (Pflanzen)
        this.createStation(2, 6, "bed", 0x00ff00, "BEET (E)");

        this.player = new Player(this, 400, 300);
        this.physics.add.collider(this.player, this.interactables);

        // UI für Progress
        this.progressGfx = this.add.graphics();
        this.buyProgress = 0;
    }

    createStation(gx, gy, type, color, label) {
        let pos = getIsoPos(gx, gy);
        let container = this.add.container(pos.x, pos.y + TILE_SIZE/2);
        container.type = type;
        container.heldItem = null;

        let g = this.add.graphics();
        // Tisch-Körper
        g.lineStyle(2, color, 1);
        g.fillStyle(color, 0.1);
        g.beginPath(); g.moveTo(0, -TILE_SIZE/2); g.lineTo(TILE_SIZE, 0); g.lineTo(0, TILE_SIZE/2); g.lineTo(-TILE_SIZE, 0); g.closePath();
        g.fillPath(); g.strokePath();
        container.add(g);

        this.add.text(pos.x, pos.y + TILE_SIZE, label, {fontSize: "10px", color: "#888"}).setOrigin(0.5);
        
        this.interactables.add(container);
        container.body.setSize(TILE_SIZE*1.5, TILE_SIZE);
    }

    update() {
        let isMoving = this.player.update(this.keys);
        this.progressGfx.clear();

        // Checke Interaktion
        let closest = null;
        let minDist = 50;

        this.interactables.children.iterate(station => {
            let dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, station.x, station.y);
            if (dist < minDist) {
                closest = station;
                minDist = dist;
            }
        });

        if (closest) {
            if (this.keys.E.isDown) {
                if (closest.type === "seed_shop") {
                    this.handleSeedShop(closest, isMoving);
                } else if (Phaser.Input.Keyboard.JustDown(this.keys.E)) {
                    this.handleGenericInteraction(closest);
                }
            } else {
                this.buyProgress = 0; // Reset wenn E losgelassen
            }
        } else {
            this.buyProgress = 0;
        }
    }

    handleSeedShop(station, isMoving) {
        if (isMoving) {
            this.buyProgress = 0;
            return;
        }
        if (this.player.heldItem) return; // Hand voll

        this.buyProgress += 0.02; // Geschwindigkeit des Kaufs
        this.drawProgressBar(this.player.x, this.player.y - 60, this.buyProgress);

        if (this.buyProgress >= 1) {
            this.buyProgress = 0;
            let seed = new Item(this, "seed");
            this.player.pickup(seed);
        }
    }

    handleGenericInteraction(station) {
        // TISCH / LAGER
        if (station.type === "storage") {
            if (this.player.heldItem && !station.heldItem) {
                // Ablegen
                let item = this.player.drop();
                station.heldItem = item;
                station.add(item);
                item.setPosition(0, -10);
            } else if (!this.player.heldItem && station.heldItem) {
                // Aufheben
                let item = station.heldItem;
                station.heldItem = null;
                station.remove(item);
                this.player.pickup(item);
            }
        }
    }

    drawProgressBar(x, y, pct) {
        this.progressGfx.lineStyle(2, 0x00ffff, 1);
        this.progressGfx.strokeCircle(x, y, 12);
        this.progressGfx.fillStyle(0x00ffff, 0.8);
        this.progressGfx.beginPath();
        this.progressGfx.moveTo(x, y);
        this.progressGfx.arc(x, y, 12, -Math.PI/2, -Math.PI/2 + (Math.PI*2*pct), false);
        this.progressGfx.fillPath();
    }
}

const config = {
    type: Phaser.AUTO,
    width: 1000,
    height: 700,
    backgroundColor: '#050505',
    physics: { default: 'arcade', arcade: { debug: false } },
    scene: MainScene
};
const game = new Phaser.Game(config);

</script>
</body>
</html>
