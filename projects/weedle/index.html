<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Weedle - Finales Grafik Konzept</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    </style>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        backgroundColor: '#050505',
        physics: {
            default: 'arcade',
            arcade: { debug: false }
        },
        scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);
    let player;
    let playerEyes;
    let keys;
    let walls;
    let trailEmitter;

    function preload() {}

    function create() {
        walls = this.physics.add.staticGroup();

        // 1. Partikel-Textur für den Schweif generieren (Kein Bild-Upload nötig!)
        let particleGraphics = this.make.graphics();
        particleGraphics.fillStyle(0x00ff00, 1);
        particleGraphics.fillRect(0, 0, 6, 6);
        particleGraphics.generateTexture('trail_tex', 6, 6);

        // 2. Das Neon-Gitter (Gerade & Sauber)
        const floor = this.add.graphics();
        floor.lineStyle(1, 0x003333, 0.4); 
        for(let x = 0; x <= 800; x += 40) { floor.moveTo(x, 0); floor.lineTo(x, 600); }
        for(let y = 0; y <= 600; y += 40) { floor.moveTo(0, y); floor.lineTo(800, y); }
        floor.strokePath();

        // 3. Orthogonale Wände (Draufsicht mit Tiefe)
        createWall(this, 150, 100, 500, 40, 20, 0x00ffff); // Oben
        createWall(this, 150, 100, 40, 400, 20, 0x00ffff); // Links
        createWall(this, 610, 100, 40, 400, 20, 0x00ffff); // Rechts

        // Tisch (Simples Rechteck)
        createTable(this, 350, 250, 100, 60, 0xff00ff);

        // 4. Der Player (Neon-Bot)
        player = this.add.container(400, 300);
        this.physics.world.enable(player);
        player.body.setCollideWorldBounds(true);
        player.body.setSize(24, 24);
        player.body.setOffset(-12, -12);

        // Player Optik
        let playerBody = this.add.graphics();
        playerBody.lineStyle(2, 0x00ff00, 1);
        playerBody.strokeRect(-12, -12, 24, 24);
        playerBody.fillStyle(0x002200, 0.8);
        playerBody.fillRect(-12, -12, 24, 24);
        player.add(playerBody);

        // Player Augen (Schauen nach rechts als Startwert)
        playerEyes = this.add.graphics();
        playerEyes.fillStyle(0x00ff00, 1);
        playerEyes.fillRect(4, -6, 4, 4); // Linkes Auge
        playerEyes.fillRect(4, 2, 4, 4);  // Rechtes Auge
        player.add(playerEyes);

        // 5. Der Neon-Schweif (Partikel)
        trailEmitter = this.add.particles(0, 0, 'trail_tex', {
            speed: 10,
            lifespan: 300,
            scale: { start: 1, end: 0 },
            alpha: { start: 0.4, end: 0 },
            blendMode: 'ADD',
            emitting: false // Wird nur beim Laufen aktiviert
        });
        trailEmitter.startFollow(player);

        // Kollisionen
        this.physics.add.collider(player, walls);
        keys = this.input.keyboard.addKeys('W,A,S,D');
    }

    function update() {
        let speed = 250;
        player.body.setVelocity(0);

        let movingX = 0;
        let movingY = 0;

        if (keys.A.isDown) movingX = -1;
        if (keys.D.isDown) movingX = 1;
        if (keys.W.isDown) movingY = -1;
        if (keys.S.isDown) movingY = 1;

        // Diagonal-Fix
        if (movingX !== 0 && movingY !== 0) {
            movingX *= 0.7071;
            movingY *= 0.7071;
        }

        player.body.setVelocityX(movingX * speed);
        player.body.setVelocityY(movingY * speed);

        // Blickrichtung & Schweif steuern
        if (movingX !== 0 || movingY !== 0) {
            let angle = Math.atan2(movingY, movingX);
            
            // Augen in Laufrichtung drehen
            playerEyes.rotation = angle;
            
            // Schweif aktivieren und Offset auf den "Rücken" legen
            trailEmitter.emitting = true;
            trailEmitter.followOffset.x = -Math.cos(angle) * 12; // 12 Pixel hinter der Mitte
            trailEmitter.followOffset.y = -Math.sin(angle) * 12;
        } else {
            // Beim Stehenbleiben hört der Schweif auf
            trailEmitter.emitting = false;
        }
    }

    // --- HILFSFUNKTIONEN ---

    function createWall(scene, x, y, w, h, depth, color) {
        let wallVisual = scene.add.graphics();
        wallVisual.fillStyle(color, 0.2);
        wallVisual.fillRect(x, y, w, depth); 
        wallVisual.lineStyle(2, color, 1);
        wallVisual.strokeRect(x, y, w, depth);
        wallVisual.fillStyle(color, 0.1);
        wallVisual.fillRect(x, y + depth, w, h - depth);
        wallVisual.lineStyle(1, color, 0.6);
        wallVisual.strokeRect(x, y + depth, w, h - depth);
        
        let zone = scene.add.zone(x + w/2, y + h/2, w, h);
        scene.physics.add.existing(zone, true);
        walls.add(zone);
    }

    function createTable(scene, x, y, w, h, color) {
        let tableVisual = scene.add.graphics();
        tableVisual.fillStyle(color, 0.1); 
        tableVisual.fillRect(x, y, w, h);
        tableVisual.lineStyle(2, color, 1);
        tableVisual.strokeRect(x, y, w, h);

        let zone = scene.add.zone(x + w/2, y + h/2, w, h);
        scene.physics.add.existing(zone, true);
        walls.add(zone);
    }
</script>
</body>
</html>
