<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Weedle - Isometric Concept Art</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background-color: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    </style>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO,
        width: 1000,
        height: 700,
        backgroundColor: '#050505',
        scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);
    let player;
    let cursors;
    const TILE_SIZE = 40;
    const OFFSET_X = 500;
    const OFFSET_Y = 100;

    function preload() {}

    function create() {
        const g = this.add.graphics();

        // 1. Das Isometrische Grid zeichnen (Neon-Cyan)
        g.lineStyle(1, 0x005555, 0.3);
        const gridSize = 12;
        for (let x = 0; x <= gridSize; x++) {
            for (let y = 0; y <= gridSize; y++) {
                let pos = getIsoPos(x, y);
                drawIsoTile(g, pos.x, pos.y, TILE_SIZE, 0, 0, 0); // Nur Umrisse
            }
        }

        // --- CONCEPT ART SHOWCASE ---

        // Laser-Tür (Grid: 1, 1)
        drawLaserDoor(g, 1, 1);
        addLabel(this, 1, 1, "LASER-TÜR");

        // Samen-Terminal (Grid: 4, 1)
        drawIsoCube(g, 4, 1, TILE_SIZE, 30, 0xffaa00, 0.2, 0.1);
        drawSeedHologram(g, 4, 1, 50);
        addLabel(this, 4, 1, "SAMEN-TERMINAL");

        // Beete: Die 3 Wachstumsphasen (Grid: 2, 4 bis 4, 4)
        drawIsoTile(g, getIsoPos(2, 4).x, getIsoPos(2, 4).y, TILE_SIZE, 0x00ff00, 0.05, 1); // Empty
        addLabel(this, 2, 4, "BEET (LEER)");

        drawIsoTile(g, getIsoPos(3, 4).x, getIsoPos(3, 4).y, TILE_SIZE, 0x00ff00, 0.1, 1);
        drawPlant(g, 3, 4, 1); // Growing
        addLabel(this, 3, 4, "WACHSTUM");

        drawIsoTile(g, getIsoPos(4, 4).x, getIsoPos(4, 4).y, TILE_SIZE, 0x00ff00, 0.2, 1);
        drawPlant(g, 4, 4, 2); // Ready
        addLabel(this, 4, 4, "ERNTEBEREIT");

        // Theke / Tisch mit Item (Grid: 8, 4)
        drawIsoCube(g, 8, 4, TILE_SIZE, 20, 0x00ffff, 0.1, 0.05);
        drawItemCube(g, 8, 4, 30, 0x00ff00); // Fertiges Paket auf dem Tisch
        addLabel(this, 8, 4, "LAGER-THEKE\n(+ ITEM)");

        // Kasse mit Kunden (Grid: 8, 8)
        drawIsoCube(g, 8, 8, TILE_SIZE, 20, 0xff00ff, 0.1, 0.05); // Tisch
        drawIsoCube(g, 8, 8, 15, 35, 0xff00ff, 0.3, 0.1); // Kasse
        addLabel(this, 8, 8, "VERKAUF\n(KASSE)");

        // Kunde (Wartet an Kasse) (Grid: 9, 9)
        drawCharacter(g, 9, 9, 0xff8800); 
        drawSpeechBubble(g, 9, 9);
        addLabel(this, 9, 9, "KUNDE");

        // Angestellter (Bot) (Grid: 2, 8)
        drawCharacter(g, 2, 8, 0x0088ff);
        addLabel(this, 2, 8, "ANGESTELLTER");


        // --- DER PLAYER ---
        player = this.add.container(getIsoPos(6, 6).x, getIsoPos(6, 6).y);
        let playerBody = this.add.graphics();
        playerBody.fillStyle(0x00ff00, 0.8);
        playerBody.fillEllipse(0, 0, 24, 12); // Isometrischer Schatten/Basis
        playerBody.lineStyle(2, 0x00ff00, 1);
        playerBody.strokeRect(-8, -35, 16, 35); // Körper
        playerBody.fillStyle(0x003300, 0.8);
        playerBody.fillRect(-8, -35, 16, 35);
        player.add(playerBody);

        cursors = this.input.keyboard.createCursorKeys();
        
        this.add.text(10, 10, "WASD / PFEILTASTEN zum Bewegen\n(Intuitive Screen-Steuerung)", { font: "16px Arial", fill: "#fff" });
    }

    function update() {
        // Intuitive Steuerung (Oben ist Oben auf dem Bildschirm)
        let speed = 4;
        if (cursors.left.isDown) player.x -= speed;
        if (cursors.right.isDown) player.x += speed;
        if (cursors.up.isDown) player.y -= speed;
        if (cursors.down.isDown) player.y += speed;
    }

    // --- HILFSFUNKTIONEN FÜR ISOMETRISCHES DESIGN ---

    function getIsoPos(gridX, gridY) {
        return {
            x: OFFSET_X + (gridX - gridY) * TILE_SIZE,
            y: OFFSET_Y + (gridX + gridY) * (TILE_SIZE / 2)
        };
    }

    function addLabel(scene, gridX, gridY, text) {
        let pos = getIsoPos(gridX, gridY);
        let t = scene.add.text(pos.x, pos.y + 20, text, { font: "10px Arial", fill: "#888", align: "center" });
        t.setOrigin(0.5, 0);
    }

    function drawIsoTile(g, x, y, size, fillHex, fillAlpha, strokeAlpha) {
        g.beginPath();
        g.moveTo(x, y);
        g.lineTo(x + size, y + size / 2);
        g.lineTo(x, y + size);
        g.lineTo(x - size, y + size / 2);
        g.closePath();
        if (fillAlpha > 0) { g.fillStyle(fillHex, fillAlpha); g.fillPath(); }
        if (strokeAlpha > 0) { g.lineStyle(2, fillHex, strokeAlpha); g.strokePath(); }
    }

    function drawIsoCube(g, gridX, gridY, size, height, color, topAlpha, sideAlpha) {
        let pos = getIsoPos(gridX, gridY);
        let x = pos.x, y = pos.y;
        
        // Rechte Seite
        g.fillStyle(color, sideAlpha * 0.6);
        g.beginPath(); g.moveTo(x, y + size); g.lineTo(x + size, y + size/2); g.lineTo(x + size, y + size/2 - height); g.lineTo(x, y + size - height); g.closePath(); g.fillPath(); g.lineStyle(1, color, 1); g.strokePath();
        
        // Linke Seite
        g.fillStyle(color, sideAlpha);
        g.beginPath(); g.moveTo(x, y + size); g.lineTo(x - size, y + size/2); g.lineTo(x - size, y + size/2 - height); g.lineTo(x, y + size - height); g.closePath(); g.fillPath(); g.strokePath();
        
        // Oben
        drawIsoTile(g, x, y - height, size, color, topAlpha, 1);
    }

    function drawLaserDoor(g, gridX, gridY) {
        let pos = getIsoPos(gridX, gridY);
        // Säulen
        drawIsoCube(g, gridX, gridY, 5, 40, 0x00ffff, 0.5, 0.3); // Hinten
        drawIsoCube(g, gridX + 0.8, gridY + 0.8, 5, 40, 0x00ffff, 0.5, 0.3); // Vorne
        // Laser-Gitter
        g.lineStyle(1, 0xff0000, 0.8);
        for(let i=0; i<4; i++) {
            g.moveTo(pos.x, pos.y - 10 - (i*8));
            g.lineTo(pos.x + 30, pos.y + 15 - 10 - (i*8));
        }
    }

    function drawSeedHologram(g, gridX, gridY, height) {
        let pos = getIsoPos(gridX, gridY);
        g.lineStyle(2, 0xffff00, 1);
        g.strokeEllipse(pos.x, pos.y - height, 20, 10);
        g.fillStyle(0xffff00, 1);
        g.fillCircle(pos.x, pos.y - height, 3); // Kern
    }

    function drawPlant(g, gridX, gridY, phase) {
        let pos = getIsoPos(gridX, gridY);
        g.lineStyle(2, 0x00ff00, 1);
        if (phase === 1) {
            // Kleiner Spross
            g.moveTo(pos.x, pos.y + 20); g.lineTo(pos.x, pos.y);
            g.lineTo(pos.x - 5, pos.y - 5); g.moveTo(pos.x, pos.y); g.lineTo(pos.x + 5, pos.y - 5);
        } else if (phase === 2) {
            // Fertige geometrische "Neon-Pflanze"
            g.strokeTriangle(pos.x, pos.y - 20, pos.x - 10, pos.y, pos.x + 10, pos.y);
            g.strokeTriangle(pos.x, pos.y - 10, pos.x - 15, pos.y + 10, pos.x + 15, pos.y + 10);
        }
    }

    function drawItemCube(g, gridX, gridY, hoverHeight, color) {
        // Kleiner schwebender Item-Würfel
        drawIsoCube(g, gridX, gridY, 8, hoverHeight, color, 0.6, 0.3);
    }

    function drawCharacter(g, gridX, gridY, color) {
        let pos = getIsoPos(gridX, gridY);
        g.fillStyle(color, 0.4);
        g.fillEllipse(pos.x, pos.y + 20, 20, 10); // Schatten
        g.lineStyle(2, color, 1);
        g.strokeRect(pos.x - 6, pos.y - 15, 12, 30); // Körper
    }

    function drawSpeechBubble(g, gridX, gridY) {
        let pos = getIsoPos(gridX, gridY);
        let bx = pos.x + 15, by = pos.y - 40;
        g.lineStyle(1, 0xffffff, 0.8);
        g.fillStyle(0x000000, 0.8);
        g.beginPath(); g.moveTo(bx, by); g.lineTo(bx+20, by); g.lineTo(bx+20, by-15); g.lineTo(bx-5, by-15); g.lineTo(bx-5, by-5); g.closePath();
        g.fillPath(); g.strokePath();
        // Item-Wunsch (Grüner Block) im Bubble
        g.fillStyle(0x00ff00, 1); g.fillRect(bx+2, by-12, 8, 8);
    }
</script>
</body>
</html>
