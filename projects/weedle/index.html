<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover: Notch-Bereich wird über die safe-area-Insets
         behandelt statt einfach abgeschnitten.
         user-scalable=no: verhindert versehentliches Zoomen beim Spielen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Weedle</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

            /* Kein Wischen/Überscrollen, während man den Joystick zieht */
            overscroll-behavior: none;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #game {
            position: fixed;
            inset: 0;

            /* 100vh ist auf Handys die Höhe OHNE Browserleisten — dadurch war
               das Spielfeld höher als der sichtbare Bereich und unten
               abgeschnitten. dvh nimmt die tatsächlich sichtbare Höhe. */
            width: 100vw;
            height: 100vh;
            height: 100dvh;

            /* Notch/abgerundete Ecken aussparen, sonst wirkt alles verschoben */
            padding-top: env(safe-area-inset-top, 0px);
            padding-right: env(safe-area-inset-right, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            box-sizing: border-box;

            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="game"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser-arcade-physics.min.js"></script>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
