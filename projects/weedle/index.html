<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background-color: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    </style>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        backgroundColor: '#050505', // Deep Black
        scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);
    let player;
    let cursors;

    function preload() {}

    function create() {
        // 1. Das Isometrische Grid zeichnen (Neon-Blau)
        const graphics = this.add.graphics();
        graphics.lineStyle(1, 0x00ffff, 0.3); // Neon Cyan mit Transparenz

        const gridSize = 10;
        const tileSize = 40;

        for (let x = 0; x <= gridSize; x++) {
            for (let y = 0; y <= gridSize; y++) {
                // Isometrische Koordinaten berechnen
                let isoX = (x - y) * (tileSize);
                let isoY = (x + y) * (tileSize / 2);
                
                // Wir zeichnen ein Diamant-Feld (Isometric Tile)
                drawIsoTile(graphics, 400 + isoX, 100 + isoY, tileSize);
            }
        }

        // 2. Ein "Neon-Beet" als Prototyp (Leuchtendes Pink)
        createNeonStation(this, 400, 250, 0xff00ff);

        // 3. Der Player (Ein einfacher Neon-Zylinder-Ersatz)
        player = this.add.container(400, 200);
        let playerBody = this.add.graphics();
        playerBody.fillStyle(0x00ff00, 1);
        playerBody.fillEllipse(0, 0, 20, 10); // Schatten/Basis
        playerBody.fillStyle(0x00ff00, 0.8);
        playerBody.fillRect(-10, -40, 20, 40); // Körper
        player.add(playerBody);

        cursors = this.input.keyboard.createCursorKeys();
    }

    function update() {
        // Simples Movement (noch nicht isometrisch korrigiert, aber zum Testen)
        if (cursors.left.isDown) player.x -= 3;
        if (cursors.right.isDown) player.x += 3;
        if (cursors.up.isDown) player.y -= 2;
        if (cursors.down.isDown) player.y += 2;
    }

    function drawIsoTile(g, x, y, size) {
        g.beginPath();
        g.moveTo(x, y);
        g.lineTo(x + size, y + size / 2);
        g.lineTo(x, y + size);
        g.lineTo(x - size, y + size / 2);
        g.closePath();
        g.strokePath();
    }

    function createNeonStation(scene, x, y, color) {
        let g = scene.add.graphics();
        // Glow-Effekt durch mehrere Schichten
        for(let i = 5; i > 0; i--) {
            g.lineStyle(i * 2, color, 0.1);
            drawIsoTile(g, x, y, 40);
        }
        g.lineStyle(2, color, 1);
        drawIsoTile(g, x, y, 40);
        
        scene.add.text(x - 20, y - 40, "STATION", { font: "12px Arial", fill: "#fff" });
    }
</script>
</body>
</html>
