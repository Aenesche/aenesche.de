<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Weedle - Neon Prototyp 3.0 (Echte Perspektive)</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    </style>
</head>
<body>
<script>
    // Konfiguration für Matter.js (ermöglicht komplexe Polygon-Kollisionen)
    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        backgroundColor: '#050505',
        physics: {
            default: 'matter',
            matter: { debug: false } // Setze auf true für Hitbox-Vorschau
        },
        scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);
    let player;
    let playerEyes;
    let keys;
    let groundCollider;

    // Fluchtpunkt (V) und Bodengrenzen für die Perspektive
    const Fluchtpunkt = { x: 400, y: 150 }; // Zentraler Fluchtpunkt oben in der Mitte
    const BodenVorn = { y: 550, breite: 700 }; // Vordere Bodengrenze
    const BodenHinten = { y: 200, breite: 300 }; // Hintere Bodengrenze (kleiner wegen Perspektive)

    function preload() {}

    function create() {
        const self = this;

        // 1. Neon-Boden zeichnen (Perspektivisches Zentralgitter)
        const floor = this.add.graphics();
        floor.lineStyle(1, 0x003333, 0.4); // Dunkles Neon-Cyan
        
        // Vordere und hintere Bodengrenzen zeichnen
        floor.moveTo(400 - BodenVorn.breite / 2, BodenVorn.y);
        floor.lineTo(400 + BodenVorn.breite / 2, BodenVorn.y);
        floor.moveTo(400 - BodenHinten.breite / 2, BodenHinten.y);
        floor.lineTo(400 + BodenHinten.breite / 2, BodenHinten.y);
        floor.strokePath();

        // Perspektivische Gitterlinien zeichnen (konvergieren zum Fluchtpunkt)
        const gitterAnzahl = 10;
        for(let i = 0; i <= gitterAnzahl; i++) {
            let xVorn = (400 - BodenVorn.breite / 2) + (i / gitterAnzahl) * BodenVorn.breite;
            let xHinten = (400 - BodenHinten.breite / 2) + (i / gitterAnzahl) * BodenHinten.breite;
            floor.moveTo(xVorn, BodenVorn.y);
            floor.lineTo(xHinten, BodenHinten.y);
        }
        
        // Horizontale Gitterlinien
        for(let y = BodenHinten.y; y <= BodenVorn.y; y += 40) {
            // Wir müssen die Breite an dieser Y-Position berechnen
            let p = (y - BodenHinten.y) / (BodenVorn.y - BodenHinten.y);
            let breite = BodenHinten.breite + p * (BodenVorn.breite - BodenHinten.breite);
            floor.moveTo(400 - breite / 2, y);
            floor.lineTo(400 + breite / 2, y);
        }
        floor.strokePath();

        // 2. Perspektivische Wände bauen (wie in Skizze 7)
        // Wir erstellen statische Polygon-Körper für die Kollisionen
        
        // Linke Wand (Polygon)
        let wallLeft = this.add.graphics();
        wallLeft.lineStyle(2, 0x00ffff, 1);
        wallLeft.strokePolygon([
            {x: 400 - BodenVorn.breite / 2, y: BodenVorn.y}, // Vordere Ecke
            {x: 400 - BodenHinten.breite / 2, y: BodenHinten.y}, // Hintere Ecke
            {x: 400 - BodenHinten.breite / 2, y: BodenHinten.y - 100}, // Hintere Oberkante
            {x: 400 - BodenVorn.breite / 2, y: BodenVorn.y - 150} // Vordere Oberkante
        ]);
        drawDepthLines(wallLeft, 400 - BodenVorn.breite / 2, BodenVorn.y, 400 - BodenHinten.breite / 2, BodenHinten.y, 150, 100);

        // Rechte Wand (Polygon)
        let wallRight = this.add.graphics();
        wallRight.lineStyle(2, 0x00ffff, 1);
        wallRight.strokePolygon([
            {x: 400 + BodenVorn.breite / 2, y: BodenVorn.y},
            {x: 400 + BodenHinten.breite / 2, y: BodenHinten.y},
            {x: 400 + BodenHinten.breite / 2, y: BodenHinten.y - 100},
            {x: 400 + BodenVorn.breite / 2, y: BodenVorn.y - 150}
        ]);
        drawDepthLines(wallRight, 400 + BodenVorn.breite / 2, BodenVorn.y, 400 + BodenHinten.breite / 2, BodenHinten.y, 150, 100);

        // Hintere Wand (flaches Rechteck)
        let wallBack = this.add.graphics();
        wallBack.lineStyle(2, 0x00ffff, 1);
        wallBack.strokeRect(400 - BodenHinten.breite / 2, BodenHinten.y - 100, BodenHinten.breite, 100);
        wallBack.fillStyle(0x00ffff, 0.1);
        wallBack.fillRect(400 - BodenHinten.breite / 2, BodenHinten.y - 100, BodenHinten.breite, 100);

        // Vordere Bodengrenze (offener Eingang)
        let wallFront = this.add.graphics();
        wallFront.lineStyle(2, 0x666666, 1); // Graue Linie
        wallFront.moveTo(400 - BodenVorn.breite / 2, BodenVorn.y);
        wallFront.lineTo(400 + BodenVorn.breite / 2, BodenVorn.y);
        wallFront.strokePath();

        // Physik-Körper für die Wände erstellen (Statische Polygone)
        // Matter.js Polygone werden um ihren Schwerpunkt zentriert erstellt
        let verticesLeft = [
            {x: 400 - BodenVorn.breite / 2, y: BodenVorn.y},
            {x: 400 - BodenHinten.breite / 2, y: BodenHinten.y},
            {x: 400 - BodenHinten.breite / 2, y: BodenHinten.y - 100},
            {x: 400 - BodenVorn.breite / 2, y: BodenVorn.y - 150}
        ];
        // Ein Matter.js Polygonkörper muss aus Vertices erstellt werden
        let leftWallCollider = this.matter.add.fromVertices(400 - (BodenVorn.breite / 2 + BodenHinten.breite / 2) / 2, BodenVorn.y - 100, verticesLeft, { isStatic: true, friction: 0, restitution: 0 });

        let verticesRight = [
            {x: 400 + BodenVorn.breite / 2, y: BodenVorn.y},
            {x: 400 + BodenHinten.breite / 2, y: BodenHinten.y},
            {x: 400 + BodenHinten.breite / 2, y: BodenHinten.y - 100},
            {x: 400 + BodenVorn.breite / 2, y: BodenVorn.y - 150}
        ];
        let rightWallCollider = this.matter.add.fromVertices(400 + (BodenVorn.breite / 2 + BodenHinten.breite / 2) / 2, BodenVorn.y - 100, verticesRight, { isStatic: true, friction: 0, restitution: 0 });
        
        // Hintere Wand-Kollision (rechteckig)
        let backWallCollider = this.matter.add.rectangle(400, BodenHinten.y - 50, BodenHinten.breite, 100, { isStatic: true });

        // Vordere Bodengrenze-Kollision
        let frontWallCollider = this.matter.add.rectangle(400, BodenVorn.y, BodenVorn.breite, 2, { isStatic: true });

        // 3. Ein Tisch in der Mitte (Orthogonales, aber kleineres Rechteck)
        createTable(this, 400, 350, 80, 50, 0xff00ff);

        // 4. Der Player (Neon-Bot)
        player = this.add.container(400, BodenVorn.y - 50);
        // Matter.js benötigt einen Physik-Körper am Container
        this.matter.add.gameObject(player, { shape: { type: 'rectangle', width: 24, height: 24 }, friction: 0, restitution: 0 });
        player.body.setCollideWorldBounds(true);
        player.body.setSize(24, 24); // Hitbox

        // Player Visuals (Körper)
        let playerBody = this.add.graphics();
        playerBody.lineStyle(2, 0x00ff00, 1);
        playerBody.strokeRect(-12, -12, 24, 24);
        playerBody.fillStyle(0x002200, 0.8);
        playerBody.fillRect(-12, -12, 24, 24);
        player.add(playerBody);

        // Player Visuals (Augen - Blicken standardmäßig nach oben/vorne)
        playerEyes = this.add.graphics();
        playerEyes.fillStyle(0x00ff00, 1);
        playerEyes.fillRect(-6, -10, 4, 4); // Linkes Auge
        playerEyes.fillRect(2, -10, 4, 4);  // Rechtes Auge
        player.add(playerEyes);

        // Steuerung
        keys = this.input.keyboard.addKeys('W,A,S,D');
    }

    function update() {
        let speed = 200;
        player.body.setVelocity(0);

        let movingX = 0;
        let movingY = 0;

        if (keys.A.isDown) movingX = -1;
        if (keys.D.isDown) movingX = 1;
        if (keys.W.isDown) movingY = -1;
        if (keys.S.isDown) movingY = 1;

        // Diagonales Laufen fixen
        if (movingX !== 0 && movingY !== 0) {
            movingX *= 0.7071;
            movingY *= 0.7071;
        }

        player.body.setVelocityX(movingX * speed);
        player.body.setVelocityY(movingY * speed);

        // Augen in Laufrichtung drehen
        if (movingX !== 0 || movingY !== 0) {
            let angle = Math.atan2(movingY, movingX);
            playerEyes.rotation = angle - Math.PI / 2; // - 90 Grad, da die Augen "nach oben" gezeichnet wurden
        } else {
            // Standard: Augen blicken nach vorne/oben
            playerEyes.rotation = 0;
        }
    }

    // --- HILFSFUNKTIONEN FÜR DIE GRAFIK ---

    // Zeichnet die perspektivischen "Tiefen"-Linien (die vertikalen Linien an den Seiten, wie in Skizze 7)
    function drawDepthLines(graphics, xVorn, yVorn, xHinten, yHinten, hVorn, hHinten) {
        graphics.beginPath();
        graphics.lineStyle(1, 0x00ffff, 0.4);
        const tiefeAnzahl = 8;
        for(let i = 0; i < tiefeAnzahl; i++) {
            let p = i / (tiefeAnzahl - 1);
            let x = xHinten + p * (xVorn - xHinten);
            let y = yHinten + p * (yVorn - yHinten);
            let h = hHinten + p * (hVorn - hHinten);
            graphics.moveTo(x, y);
            graphics.lineTo(x, y - h);
        }
        graphics.strokePath();
    }

    function createTable(scene, x, y, w, h, color) {
        let tableVisual = scene.add.graphics();
        
        // Glasfläche (transparent, orthogonal)
        tableVisual.fillStyle(color, 0.1); 
        tableVisual.fillRect(x - w/2, y - h/2, w, h);
        
        // Leuchtender Rahmen
        tableVisual.lineStyle(2, color, 1);
        tableVisual.strokeRect(x - w/2, y - h/2, w, h);

        // Physik-Hitbox erstellen (Matte.js, rechteckig, zentriert)
        scene.matter.add.rectangle(x, y, w, h, { isStatic: true, friction: 0, restitution: 0 });
    }
</script>
</body>
</html>
