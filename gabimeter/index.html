<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<meta name="robots" content="noindex">
<title>Gabi-Meter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0e;
    --bg-2: #141417;
    --line: rgba(255, 255, 255, 0.08);
    --text: #ece9e4;
    --muted: #8a8780;
    --pink: #ff5c8a;
    --pink-ink: #1a0710;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    color: var(--text);
    font-family: 'Sora', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100dvh;
    padding: max(20px, env(safe-area-inset-top)) 16px calc(28px + var(--safe-b));
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  .mono { font-family: 'Space Mono', ui-monospace, monospace; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  .wrap { width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: calc(76dvh - 20px); }

  h1 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--muted);
  }
  h1 span { color: var(--pink); }

  .value {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: clamp(96px, 34vw, 168px);
    line-height: 1;
    margin: 18px 0 4px;
    color: var(--pink);
    text-shadow: 0 0 40px rgba(255, 92, 138, 0.35);
    font-variant-numeric: tabular-nums;
    transition: color 0.3s;
  }
  .value.empty { color: rgba(255, 255, 255, 0.15); text-shadow: none; }
  .meta { font-size: 11.5px; color: var(--muted); height: 16px; }

  /* Skala */
  .track {
    position: relative;
    width: 100%;
    height: 10px;
    margin: 34px 0 26px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.07);
  }
  .track .fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0;
    border-radius: 10px;
    background: linear-gradient(90deg, rgba(255, 92, 138, 0.25), var(--pink));
    box-shadow: 0 0 14px rgba(255, 92, 138, 0.45);
    transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .track .knob {
    position: absolute;
    top: 50%;
    left: 0;
    width: 22px;
    height: 22px;
    margin: -11px 0 0 -11px;
    border-radius: 50%;
    background: var(--text);
    box-shadow: 0 0 0 4px var(--bg), 0 0 18px rgba(255, 92, 138, 0.7);
    transition: left 0.8s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s;
  }
  .track.empty .knob { opacity: 0; }

  /* Buttons 1–10 */
  .pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; }
  .pad button {
    position: relative;
    height: 62px;
    border-radius: 14px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    font-family: 'Space Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    overflow: hidden;
    touch-action: manipulation;
    transition: border-color 0.15s, background 0.15s;
  }
  .pad button.press { background: #22171c; }
  .pad button .w {
    position: absolute;
    inset: auto 0 0 0;
    height: 0;
    background: var(--pink);
    opacity: 0.9;
    transition: height 1s linear;
  }
  .pad button b { position: relative; }
  .pad button.mine { border-color: var(--pink); }
  .pad button.mine b { color: var(--text); }

  .mine-line { margin-top: 16px; font-size: 11.5px; color: var(--muted); height: 16px; text-align: center; }
  .mine-line b { color: var(--text); font-weight: 700; }

  /* Verlauf */
  .hist { width: 100%; max-width: 460px; margin-top: 24px; }
  .hist-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .hist-head h2 { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; color: var(--muted); }
  .seg { display: flex; gap: 2px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { font-family: 'Space Mono', monospace; font-size: 11.5px; padding: 5px 11px; border-radius: 7px; color: var(--muted); }
  .seg .zr { color: var(--pink); padding: 5px 9px; }
  .seg .zr[hidden] { display: none; }
  .dim { opacity: 0.6; }
  .seg button.on { background: rgba(255, 92, 138, 0.16); color: var(--text); }
  .chart {
    position: relative;
    height: 190px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    touch-action: pan-y;
    cursor: crosshair;
  }
  .chart svg { display: block; width: 100%; height: 100%; }
  .chart .lbl { font-family: 'Space Mono', monospace; font-size: 10px; fill: var(--muted); }
  .chart .grid { stroke: rgba(255, 255, 255, 0.06); stroke-width: 1; }
  .chart .line { fill: none; stroke: var(--pink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .area { fill: url(#gArea); }
  .chart .cursor { stroke: rgba(255, 255, 255, 0.25); stroke-width: 1; }
  .chart .dot { fill: var(--text); stroke: var(--pink); stroke-width: 2; }
  .chart .empty-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 11.5px; color: var(--muted); pointer-events: none; }
  .readout { height: 16px; margin-top: 8px; font-size: 11.5px; color: var(--muted); text-align: center; }
  .readout b { color: var(--text); }

  .err { position: fixed; bottom: calc(16px + var(--safe-b)); left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--muted); opacity: 0; transition: opacity 0.2s; }
  .err.show { opacity: 1; }
</style>
</head>
<body>

<div class="wrap">
  <h1>GABI<span>-</span>METER</h1>
  <div class="value empty" id="value">–</div>
  <div class="meta mono" id="meta">&nbsp;</div>

  <div class="track empty" id="track"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>

  <div class="pad" id="pad"></div>
  <div class="mine-line mono" id="mine">&nbsp;</div>
</div>
<section class="hist">
  <div class="hist-head">
    <h2>VERLAUF</h2>
    <div class="seg" id="seg">
      <button id="zoomReset" class="zr" hidden aria-label="Zoom zurücksetzen">⤢</button>
      <button data-range="day">24 h</button>
      <button data-range="week">7 Tage</button>
    </div>
  </div>
  <div class="chart" id="chart"><svg id="svg"></svg><div class="empty-msg mono" id="chartEmpty">Lade…</div></div>
  <div class="readout mono" id="readout">&nbsp;</div>
</section>
<div class="err mono" id="err"></div>

<script>
(function () {
  'use strict';

  const SB_URL = 'https://usihbregbanpfspblrnw.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzaWhicmVnYmFucGZzcGJscm53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxMDkyNzEsImV4cCI6MjA4NzY4NTI3MX0.U_f2brykxMbegtddye-hpy0lcJgtEzl1AB9lQGpd5UY';
  const DECAY = 30 * 60;   // Sekunden bis eine Stimme kein Gewicht mehr hat
  const POLL = 4000;       // ms

  const $ = (id) => document.getElementById(id);

  // Geheimer Geräte-Key (statt Login) – Server speichert nur den Hash
  function getKey() {
    let k = null;
    try { k = localStorage.getItem('gabimeter_key'); } catch (e) { /* privat */ }
    if (!k) {
      const a = new Uint8Array(24);
      crypto.getRandomValues(a);
      k = Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');
      try { localStorage.setItem('gabimeter_key', k); } catch (e) { /* egal */ }
    }
    return k;
  }
  const KEY = getKey();

  // Zustand: Alter jeder Stimme zum Empfangszeitpunkt + lokale Uhr
  let votes = [];          // [{v, age}]
  let mine = null;         // {v, age} | null
  let receivedAt = 0;
  let lastAvg = null;        // aktueller Wert fürs Graph-Ende (0 = keine Stimmen)

  async function rpc(fn, body) {
    const r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: {
        apikey: SB_KEY,
        Authorization: 'Bearer ' + SB_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });
    const data = await r.json().catch(() => null);
    if (!r.ok) throw new Error((data && data.message) || 'Fehler ' + r.status);
    return data;
  }

  function apply(state) {
    votes = (state && state.votes) || [];
    mine = (state && state.mine) || null;
    receivedAt = performance.now();
    render();
  }

  let errT;
  function showErr(msg) {
    const e = $('err');
    e.textContent = msg;
    e.classList.add('show');
    clearTimeout(errT);
    errT = setTimeout(() => e.classList.remove('show'), 2500);
  }

  // ---------- Buttons ----------
  const pad = $('pad');
  for (let i = 1; i <= 10; i++) {
    const b = document.createElement('button');
    b.dataset.v = i;
    b.innerHTML = '<span class="w"></span><b>' + i + '</b>';
    pad.appendChild(b);
  }
  // Sofort beim Antippen (pointerdown) – kein Warten aufs Loslassen.
  // Schnelles Umentscheiden: nur der letzte Wert wird gesendet.
  let pending = null, sending = false, lastSent = 0;
  const GAP = 1100; // ms – Server erlaubt 1 Stimme pro Sekunde

  function vote(v) {
    // lokal sofort anzeigen
    const el = (performance.now() - receivedAt) / 1000;
    votes = votes.map((x) => ({ v: x.v, age: x.age + el }));
    if (mine) {
      const myAge = mine.age + el;
      let best = -1, d = 1e9;
      votes.forEach((x, i) => {
        const dd = Math.abs(x.age - myAge);
        if (x.v === mine.v && dd < d) { d = dd; best = i; }
      });
      if (best >= 0) votes.splice(best, 1);
    }
    votes.push({ v, age: 0 });
    mine = { v, age: 0 };
    receivedAt = performance.now();
    render();
    pending = v;
    flush();
  }

  async function flush() {
    if (sending || pending == null) return;
    const wait = lastSent + GAP - Date.now();
    if (wait > 0) { setTimeout(flush, wait); return; }
    const v = pending;
    pending = null;
    sending = true;
    lastSent = Date.now();
    try {
      const st = await rpc('gabi_vote', { p_key: KEY, p_value: v });
      if (pending == null) apply(st);
    } catch (err) {
      showErr(err.message);
      if (pending == null) refresh();
    } finally {
      sending = false;
      if (pending != null) flush();
    }
  }

  pad.addEventListener('pointerdown', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    e.preventDefault();
    b.classList.add('press');
    setTimeout(() => b.classList.remove('press'), 150);
    vote(+b.dataset.v);
  });
  pad.addEventListener('contextmenu', (e) => e.preventDefault());

  // ---------- Rendern ----------
  function render() {
    const el = (performance.now() - receivedAt) / 1000;
    let sw = 0, swv = 0, active = 0;
    votes.forEach((x) => {
      const w = Math.max(0, 1 - (x.age + el) / DECAY);
      if (w <= 0) return;
      sw += w; swv += w * x.v; active++;
    });

    const valEl = $('value');
    const track = $('track');
    if (sw > 0) {
      const avg = swv / sw;
      lastAvg = avg;
      valEl.textContent = avg.toFixed(1).replace('.', ',');
      valEl.classList.remove('empty');
      track.classList.remove('empty');
      const pct = ((avg - 1) / 9) * 100;
      $('fill').style.width = pct + '%';
      $('knob').style.left = pct + '%';
      $('meta').textContent = active + (active === 1 ? ' Stimme' : ' Stimmen');
    } else {
      lastAvg = 0;
      valEl.textContent = '–';
      valEl.classList.add('empty');
      track.classList.add('empty');
      $('fill').style.width = '0';
      $('meta').textContent = 'Noch keine Stimmen';
    }

    const myW = mine ? Math.max(0, 1 - (mine.age + el) / DECAY) : 0;
    pad.querySelectorAll('button').forEach((b) => {
      const isMine = myW > 0 && +b.dataset.v === mine.v;
      b.classList.toggle('mine', isMine);
      b.querySelector('.w').style.height = isMine ? (myW * 100) + '%' : '0';
    });
    if (myW > 0) {
      const left = Math.ceil(DECAY * myW / 60);
      $('mine').innerHTML = 'Dein Wert <b>' + mine.v + '</b> · noch ' + left + ' min';
    } else {
      $('mine').innerHTML = '&nbsp;';
    }
  }

  // ---------- Sync ----------
  async function refresh() {
    try {
      const st = await rpc('gabi_state', { p_key: KEY });
      if (!sending && pending == null) apply(st);
    }
    catch (e) { showErr('Offline?'); }
  }
  refresh();
  setInterval(() => { if (!document.hidden) refresh(); }, POLL);
  setInterval(render, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { refresh(); loadHistory(); } });

  // ============================================================
  //  Verlauf (Datenpunkte speichert Supabase per pg_cron:
  //  24 h → alle 2 min, 7 Tage → alle 30 min, alte werden gelöscht)
  //  Keine Stimmen = 0 (Linie unten), Kurve geglättet ohne Überschwingen,
  //  Zoom per Pinch / Mausrad, verschieben per Ziehen.
  // ============================================================
  const RANGES = {
    day:  { max: 24 * 3600e3,     min: 20 * 60e3,  step: 2 * 60e3 },
    week: { max: 7 * 24 * 3600e3, min: 6 * 3600e3, step: 30 * 60e3 }
  };
  let range = 'day';
  try { if (localStorage.getItem('gabimeter_range') === 'week') range = 'week'; } catch (e) { /* egal */ }
  let hist = [];               // Rohdaten [[ms, wert|null], ...]
  let loaded = false;
  let view = { span: RANGES[range].max, end: null };   // end null = live (endet bei "jetzt")
  let sel = null;              // ausgewählter Zeitpunkt (ms) für die Anzeige
  let geo = null;

  const svg = $('svg');
  const chart = $('chart');
  const NS = 'http://www.w3.org/2000/svg';
  const COARSE = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  const HINT = COARSE ? 'Zwei Finger zum Zoomen' : 'Mausrad zum Zoomen';
  const pad2 = (n) => String(n).padStart(2, '0');
  const DAYS = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

  function paintSeg() {
    $('seg').querySelectorAll('[data-range]').forEach((b) => b.classList.toggle('on', b.dataset.range === range));
    $('zoomReset').hidden = view.span >= RANGES[range].max - 1;
  }
  $('seg').addEventListener('click', (e) => {
    const b = e.target.closest('[data-range]');
    if (!b || b.dataset.range === range) return;
    range = b.dataset.range;
    try { localStorage.setItem('gabimeter_range', range); } catch (err) { /* egal */ }
    view = { span: RANGES[range].max, end: null };
    sel = null;
    hist = []; loaded = false;
    paintSeg();
    drawChart();
    loadHistory();
  });
  $('zoomReset').addEventListener('click', () => {
    view = { span: RANGES[range].max, end: null };
    sel = null;
    paintSeg();
    drawChart();
  });

  async function loadHistory() {
    try {
      const data = await rpc('gabi_history', { p_range: range });
      hist = Array.isArray(data) ? data.map((p) => [+p[0], p[1] == null ? null : +p[1]]) : [];
      loaded = true;
      drawChart();
    } catch (e) {
      hist = []; loaded = true;
      drawChart('Verlauf nicht verfügbar');
    }
  }

  // Rohdaten → durchgehende Reihe: null = 0, fehlende Punkte = 0, plus Live-Wert am Ende (Tag)
  function series() {
    const step = RANGES[range].step;
    const out = [];
    let prev = null;
    hist.forEach(([t, v]) => {
      if (prev != null && t - prev > step * 2.5) {
        out.push([prev + step, 0]);
        out.push([t - step, 0]);
      }
      out.push([t, v == null ? 0 : v]);
      prev = t;
    });
    const now = Date.now();
    if (range === 'day' && out.length && lastAvg != null) {
      if (now - prev > step * 2.5) out.push([prev + step, 0], [now - step, 0]);
      out.push([now, lastAvg]);
    }
    return out;
  }

  function clampView() {
    const c = RANGES[range];
    const now = Date.now();
    view.span = Math.max(c.min, Math.min(c.max, view.span));
    let end = view.end == null ? now : view.end;
    end = Math.min(now, Math.max(now - c.max + view.span, end));
    view.end = now - end < c.step / 2 ? null : end;   // nah an "jetzt" → wieder live
  }

  function viewBounds() {
    const t1 = view.end == null ? Date.now() : view.end;
    return [t1 - view.span, t1];
  }

  function el(tag, attrs, text) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }

  // Monotone kubische Kurve (wie d3 curveMonotoneX): geht exakt durch jeden Punkt,
  // schießt nie darüber hinaus → Spitzen bleiben sichtbar, keine scharfen Ecken
  function monoPath(P) {
    const n = P.length;
    if (n === 1) return 'M' + (P[0][0] - 1.5) + ' ' + P[0][1] + 'L' + (P[0][0] + 1.5) + ' ' + P[0][1];
    const sign = (v) => (v < 0 ? -1 : v > 0 ? 1 : 0);
    const t = new Array(n);
    for (let i = 1; i < n - 1; i++) {
      const h0 = P[i][0] - P[i - 1][0], h1 = P[i + 1][0] - P[i][0];
      const s0 = h0 ? (P[i][1] - P[i - 1][1]) / h0 : 0;
      const s1 = h1 ? (P[i + 1][1] - P[i][1]) / h1 : 0;
      const p = (s0 * h1 + s1 * h0) / ((h0 + h1) || 1);
      t[i] = (sign(s0) + sign(s1)) * Math.min(Math.abs(s0), Math.abs(s1), 0.5 * Math.abs(p)) || 0;
    }
    const end = (a, b, tb) => {
      const h = P[b][0] - P[a][0];
      return h ? (3 * (P[b][1] - P[a][1]) / h - tb) / 2 : 0;
    };
    if (n === 2) { t[0] = t[1] = (P[1][1] - P[0][1]) / ((P[1][0] - P[0][0]) || 1); }
    else { t[0] = end(0, 1, t[1]); t[n - 1] = end(n - 2, n - 1, t[n - 2]); }
    const f = (v) => v.toFixed(1);
    let d = 'M' + f(P[0][0]) + ' ' + f(P[0][1]);
    for (let i = 0; i < n - 1; i++) {
      const h = (P[i + 1][0] - P[i][0]) / 3;
      d += 'C' + f(P[i][0] + h) + ' ' + f(P[i][1] + t[i] * h) + ' ' +
        f(P[i + 1][0] - h) + ' ' + f(P[i + 1][1] - t[i + 1] * h) + ' ' + f(P[i + 1][0]) + ' ' + f(P[i + 1][1]);
    }
    return d;
  }

  // Achsenbeschriftung passend zur Zoomstufe
  const TICKS = [5, 10, 15, 30, 60, 120, 180, 360, 720, 1440];   // Minuten
  function timeTicks(t0, t1, width) {
    const maxTicks = Math.max(2, Math.floor(width / 62));
    const iv = TICKS.find((m) => (t1 - t0) / (m * 60e3) <= maxTicks) || 1440;
    const out = [];
    const d = new Date(t0);
    d.setHours(0, 0, 0, 0);
    if (iv >= 1440) {
      for (; d.getTime() < t0; d.setDate(d.getDate() + 1));
      for (; d.getTime() <= t1; d.setDate(d.getDate() + 1)) out.push([d.getTime(), DAYS[d.getDay()]]);
      return out;
    }
    for (let guard = 0; d.getTime() < t0 && guard < 2000; guard++) d.setMinutes(d.getMinutes() + iv);
    for (let guard = 0; d.getTime() <= t1 && guard < 400; guard++) {
      const midnight = d.getHours() === 0 && d.getMinutes() === 0;
      out.push([d.getTime(), midnight && (t1 - t0) > 6 * 3600e3 ? DAYS[d.getDay()] : pad2(d.getHours()) + ':' + pad2(d.getMinutes())]);
      d.setMinutes(d.getMinutes() + iv);
    }
    return out;
  }

  function drawChart(msg) {
    const W = chart.clientWidth, H = chart.clientHeight;
    if (!W) return;
    clampView();
    paintSeg();
    const L = 26, R = 10, T = 12, B = 22;
    const iw = W - L - R, ih = H - T - B;
    const [t0, t1] = viewBounds();
    const x = (t) => L + ((t - t0) / (t1 - t0)) * iw;
    const y = (v) => T + (1 - v / 10) * ih;
    geo = { L, iw, T, ih, H, x, y, t0, t1 };

    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.innerHTML = '';
    const defs = el('defs', {});
    const grad = el('linearGradient', { id: 'gArea', x1: 0, y1: 0, x2: 0, y2: 1 });
    grad.appendChild(el('stop', { offset: '0%', 'stop-color': '#ff5c8a', 'stop-opacity': 0.32 }));
    grad.appendChild(el('stop', { offset: '100%', 'stop-color': '#ff5c8a', 'stop-opacity': 0 }));
    defs.appendChild(grad);
    const clip = el('clipPath', { id: 'gClip' });
    clip.appendChild(el('rect', { x: L, y: 0, width: iw, height: T + ih + 1 }));
    defs.appendChild(clip);
    svg.appendChild(defs);

    [0, 5, 10].forEach((v) => {
      svg.appendChild(el('line', { class: 'grid', x1: L, x2: W - R, y1: y(v), y2: y(v) }));
      svg.appendChild(el('text', { class: 'lbl', x: L - 6, y: y(v) + 3.5, 'text-anchor': 'end' }, v));
    });
    timeTicks(t0, t1, iw).forEach(([t, label]) => {
      const xx = x(t);
      if (xx < L + 10 || xx > W - R - 10) return;
      svg.appendChild(el('line', { class: 'grid', x1: xx, x2: xx, y1: T, y2: T + ih }));
      svg.appendChild(el('text', { class: 'lbl', x: xx, y: H - 7, 'text-anchor': 'middle' }, label));
    });

    // nur sichtbare Punkte (+1 links/rechts für saubere Übergänge)
    const all = series();
    let a = 0, b = all.length - 1;
    while (a < all.length - 1 && all[a + 1][0] < t0) a++;
    while (b > 0 && all[b - 1][0] > t1) b--;
    const vis = all.slice(a, b + 1);
    if (vis.length) {
      const P = vis.map(([t, v]) => [x(t), y(v)]);
      const line = monoPath(P);
      const area = line + 'L' + P[P.length - 1][0].toFixed(1) + ' ' + y(0) + 'L' + P[0][0].toFixed(1) + ' ' + y(0) + 'Z';
      const g = el('g', { 'clip-path': 'url(#gClip)' });
      g.appendChild(el('path', { class: 'area', d: area }));
      g.appendChild(el('path', { class: 'line', d: line }));
      svg.appendChild(g);
    }

    const em = $('chartEmpty');
    em.textContent = msg || (!loaded ? 'Lade…' : (hist.length ? '' : 'Noch keine Daten'));
    em.style.display = em.textContent ? '' : 'none';
    showSel();
  }

  function nearest(t) {
    let best = null, bd = Infinity;
    series().forEach((p) => {
      if (p[0] < geo.t0 || p[0] > geo.t1) return;
      const d = Math.abs(p[0] - t);
      if (d < bd) { bd = d; best = p; }
    });
    return best;
  }

  function showSel() {
    svg.querySelectorAll('.cursor,.dot').forEach((n) => n.remove());
    const best = sel != null && geo ? nearest(sel) : null;
    if (!best) { $('readout').innerHTML = hist.length ? '<span class="dim">' + HINT + '</span>' : '&nbsp;'; return; }
    const cx = geo.x(best[0]), cy = geo.y(best[1]);
    svg.appendChild(el('line', { class: 'cursor', x1: cx, x2: cx, y1: geo.T, y2: geo.T + geo.ih }));
    svg.appendChild(el('circle', { class: 'dot', cx, cy, r: 4 }));
    const d = new Date(best[0]);
    const when = (range === 'week' ? DAYS[d.getDay()] + ' ' : '') + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    $('readout').innerHTML = when + ' · ' + (best[1] > 0 ? '<b>' + best[1].toFixed(1).replace('.', ',') + '</b>' : 'keine Stimmen');
  }

  const timeAt = (clientX) => {
    const r = chart.getBoundingClientRect();
    return geo.t0 + ((clientX - r.left - geo.L) / geo.iw) * (geo.t1 - geo.t0);
  };

  // Zoom um einen Bildschirmpunkt: Zeitpunkt unter dem Finger/Cursor bleibt stehen
  function zoomAt(clientX, newSpan, anchorT, anchorFrac) {
    const c = RANGES[range];
    newSpan = Math.max(c.min, Math.min(c.max, newSpan));
    view.end = anchorT + (1 - anchorFrac) * newSpan;
    view.span = newSpan;
  }
  const fracAt = (clientX) => {
    const r = chart.getBoundingClientRect();
    return Math.max(0, Math.min(1, (clientX - r.left - geo.L) / geo.iw));
  };

  let rafPending = false;
  function redraw() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => { rafPending = false; drawChart(); });
  }

  // ---------- Gesten ----------
  const ptrs = new Map();
  let gesture = null;

  chart.addEventListener('pointerdown', (e) => {
    if (!geo) return;
    chart.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2) {
      const [p, q] = [...ptrs.values()];
      const cx = (p.x + q.x) / 2;
      gesture = { type: 'pinch', d0: Math.max(20, Math.abs(p.x - q.x)), span0: view.span,
        anchorT: timeAt(cx) };
      sel = null;
    } else if (ptrs.size === 1) {
      gesture = { type: 'one', x0: e.clientX, y0: e.clientY, end0: viewBounds()[1], moved: false };
      if (view.span >= RANGES[range].max - 1) {
        sel = timeAt(e.clientX);   // nicht gezoomt: direkt Wert zeigen (scrubben)
        showSel();
      }
    }
  });

  chart.addEventListener('pointermove', (e) => {
    if (!geo) return;
    if (!ptrs.has(e.pointerId)) {
      if (e.pointerType === 'mouse') { sel = timeAt(e.clientX); showSel(); }   // Hover
      return;
    }
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!gesture) return;

    if (gesture.type === 'pinch' && ptrs.size >= 2) {
      const [p, q] = [...ptrs.values()];
      const d = Math.max(20, Math.abs(p.x - q.x));
      const cx = (p.x + q.x) / 2;
      zoomAt(cx, gesture.span0 * gesture.d0 / d, gesture.anchorT, fracAt(cx));
      redraw();
    } else if (gesture.type === 'one') {
      const dx = e.clientX - gesture.x0;
      if (Math.abs(dx) > 6) gesture.moved = true;
      const zoomed = view.span < RANGES[range].max - 1;
      if (zoomed && gesture.moved) {
        // verschieben
        view.end = gesture.end0 - (dx / geo.iw) * view.span;
        sel = null;
        redraw();
      } else if (!zoomed) {
        sel = timeAt(e.clientX);
        showSel();
      }
    }
  });

  function endPtr(e) {
    if (!ptrs.has(e.pointerId)) return;
    const g = gesture;
    ptrs.delete(e.pointerId);
    if (g && g.type === 'one' && !g.moved && e.type === 'pointerup') {
      sel = timeAt(e.clientX);   // Tippen: Wert zeigen
      showSel();
    }
    if (ptrs.size === 1 && g && g.type === 'pinch') {
      const [p] = [...ptrs.values()];
      gesture = { type: 'one', x0: p.x, y0: p.y, end0: viewBounds()[1], moved: true };
    } else if (ptrs.size === 0) {
      gesture = null;
    }
  }
  chart.addEventListener('pointerup', endPtr);
  chart.addEventListener('pointercancel', endPtr);
  chart.addEventListener('pointerleave', (e) => {
    if (e.pointerType === 'mouse' && !ptrs.size) { sel = null; showSel(); }
  });

  chart.addEventListener('wheel', (e) => {
    if (!geo) return;
    e.preventDefault();
    const factor = Math.exp((e.deltaY || 0) * (e.deltaMode === 1 ? 0.05 : 0.002));
    zoomAt(e.clientX, view.span * factor, timeAt(e.clientX), fracAt(e.clientX));
    redraw();
  }, { passive: false });

  chart.addEventListener('dblclick', () => $('zoomReset').click());

  let rsT;
  window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => drawChart(), 150); });
  paintSeg();
  loadHistory();
  setInterval(() => { if (!document.hidden) loadHistory(); }, 60e3);
  setInterval(() => { if (!document.hidden && view.end == null && !gesture) drawChart(); }, 10e3);
})();

</script>
</body>
</html>
