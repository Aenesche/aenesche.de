<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<meta name="robots" content="noindex">
<title>Gabi-Meter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0e;
    --bg-2: #141417;
    --line: rgba(255, 255, 255, 0.08);
    --text: #ece9e4;
    --muted: #8a8780;
    --pink: #ff5c8a;
    --pink-ink: #1a0710;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    color: var(--text);
    font-family: 'Sora', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100dvh;
    padding: max(20px, env(safe-area-inset-top)) 16px calc(28px + var(--safe-b));
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  .mono { font-family: 'Space Mono', ui-monospace, monospace; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  .wrap { width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: calc(76dvh - 20px); }

  h1 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--muted);
  }
  h1 span { color: var(--pink); }

  .value {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: clamp(96px, 34vw, 168px);
    line-height: 1;
    margin: 18px 0 4px;
    color: var(--pink);
    text-shadow: 0 0 40px rgba(255, 92, 138, 0.35);
    font-variant-numeric: tabular-nums;
    transition: color 0.3s;
  }
  .value.empty { color: rgba(255, 255, 255, 0.15); text-shadow: none; }
  .meta { font-size: 11.5px; color: var(--muted); height: 16px; }

  /* Skala */
  .track {
    position: relative;
    width: 100%;
    height: 10px;
    margin: 34px 0 26px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.07);
  }
  .track .fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0;
    border-radius: 10px;
    background: linear-gradient(90deg, rgba(255, 92, 138, 0.25), var(--pink));
    box-shadow: 0 0 14px rgba(255, 92, 138, 0.45);
    transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .track .knob {
    position: absolute;
    top: 50%;
    left: 0;
    width: 22px;
    height: 22px;
    margin: -11px 0 0 -11px;
    border-radius: 50%;
    background: var(--text);
    box-shadow: 0 0 0 4px var(--bg), 0 0 18px rgba(255, 92, 138, 0.7);
    transition: left 0.8s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s;
  }
  .track.empty .knob { opacity: 0; }

  /* Buttons 1–10 */
  .pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; }
  .pad button {
    position: relative;
    height: 62px;
    border-radius: 14px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    font-family: 'Space Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    overflow: hidden;
    touch-action: manipulation;
    transition: border-color 0.15s, background 0.15s;
  }
  .pad button.press { background: #22171c; }
  .pad button .w {
    position: absolute;
    inset: auto 0 0 0;
    height: 0;
    background: var(--pink);
    opacity: 0.9;
    transition: height 1s linear;
  }
  .pad button b { position: relative; }
  .pad button.mine { border-color: var(--pink); }
  .pad button.mine b { color: var(--text); }

  .mine-line { margin-top: 16px; font-size: 11.5px; color: var(--muted); height: 16px; text-align: center; }
  .mine-line b { color: var(--text); font-weight: 700; }

  /* Verlauf */
  .hist { width: 100%; max-width: 460px; margin-top: 24px; }
  .hist-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .hist-head h2 { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; color: var(--muted); }
  .seg { display: flex; gap: 2px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { font-family: 'Space Mono', monospace; font-size: 11.5px; padding: 5px 11px; border-radius: 7px; color: var(--muted); }
  .seg button.on { background: rgba(255, 92, 138, 0.16); color: var(--text); }
  .chart {
    position: relative;
    height: 190px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    touch-action: pan-y;
  }
  .chart svg { display: block; width: 100%; height: 100%; }
  .chart .lbl { font-family: 'Space Mono', monospace; font-size: 10px; fill: var(--muted); }
  .chart .grid { stroke: rgba(255, 255, 255, 0.06); stroke-width: 1; }
  .chart .line { fill: none; stroke: var(--pink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .area { fill: url(#gArea); }
  .chart .cursor { stroke: rgba(255, 255, 255, 0.25); stroke-width: 1; }
  .chart .dot { fill: var(--text); stroke: var(--pink); stroke-width: 2; }
  .chart .empty-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 11.5px; color: var(--muted); pointer-events: none; }
  .readout { height: 16px; margin-top: 8px; font-size: 11.5px; color: var(--muted); text-align: center; }
  .readout b { color: var(--text); }

  .err { position: fixed; bottom: calc(16px + var(--safe-b)); left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--muted); opacity: 0; transition: opacity 0.2s; }
  .err.show { opacity: 1; }
</style>
</head>
<body>

<div class="wrap">
  <h1>GABI<span>-</span>METER</h1>
  <div class="value empty" id="value">–</div>
  <div class="meta mono" id="meta">&nbsp;</div>

  <div class="track empty" id="track"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>

  <div class="pad" id="pad"></div>
  <div class="mine-line mono" id="mine">&nbsp;</div>
</div>
<section class="hist">
  <div class="hist-head">
    <h2>VERLAUF</h2>
    <div class="seg" id="seg">
      <button data-range="day">24 h</button>
      <button data-range="week">7 Tage</button>
    </div>
  </div>
  <div class="chart" id="chart"><svg id="svg"></svg><div class="empty-msg mono" id="chartEmpty">Lade…</div></div>
  <div class="readout mono" id="readout">&nbsp;</div>
</section>
<div class="err mono" id="err"></div>

<script>
(function () {
  'use strict';

  const SB_URL = 'https://usihbregbanpfspblrnw.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzaWhicmVnYmFucGZzcGJscm53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxMDkyNzEsImV4cCI6MjA4NzY4NTI3MX0.U_f2brykxMbegtddye-hpy0lcJgtEzl1AB9lQGpd5UY';
  const DECAY = 30 * 60;   // Sekunden bis eine Stimme kein Gewicht mehr hat
  const POLL = 4000;       // ms

  const $ = (id) => document.getElementById(id);

  // Geheimer Geräte-Key (statt Login) – Server speichert nur den Hash
  function getKey() {
    let k = null;
    try { k = localStorage.getItem('gabimeter_key'); } catch (e) { /* privat */ }
    if (!k) {
      const a = new Uint8Array(24);
      crypto.getRandomValues(a);
      k = Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');
      try { localStorage.setItem('gabimeter_key', k); } catch (e) { /* egal */ }
    }
    return k;
  }
  const KEY = getKey();

  // Zustand: Alter jeder Stimme zum Empfangszeitpunkt + lokale Uhr
  let votes = [];          // [{v, age}]
  let mine = null;         // {v, age} | null
  let receivedAt = 0;

  async function rpc(fn, body) {
    const r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: {
        apikey: SB_KEY,
        Authorization: 'Bearer ' + SB_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });
    const data = await r.json().catch(() => null);
    if (!r.ok) throw new Error((data && data.message) || 'Fehler ' + r.status);
    return data;
  }

  function apply(state) {
    votes = (state && state.votes) || [];
    mine = (state && state.mine) || null;
    receivedAt = performance.now();
    render();
  }

  let errT;
  function showErr(msg) {
    const e = $('err');
    e.textContent = msg;
    e.classList.add('show');
    clearTimeout(errT);
    errT = setTimeout(() => e.classList.remove('show'), 2500);
  }

  // ---------- Buttons ----------
  const pad = $('pad');
  for (let i = 1; i <= 10; i++) {
    const b = document.createElement('button');
    b.dataset.v = i;
    b.innerHTML = '<span class="w"></span><b>' + i + '</b>';
    pad.appendChild(b);
  }
  // Sofort beim Antippen (pointerdown) – kein Warten aufs Loslassen.
  // Schnelles Umentscheiden: nur der letzte Wert wird gesendet.
  let pending = null, sending = false, lastSent = 0;
  const GAP = 1100; // ms – Server erlaubt 1 Stimme pro Sekunde

  function vote(v) {
    // lokal sofort anzeigen
    const el = (performance.now() - receivedAt) / 1000;
    votes = votes.map((x) => ({ v: x.v, age: x.age + el }));
    if (mine) {
      const myAge = mine.age + el;
      let best = -1, d = 1e9;
      votes.forEach((x, i) => {
        const dd = Math.abs(x.age - myAge);
        if (x.v === mine.v && dd < d) { d = dd; best = i; }
      });
      if (best >= 0) votes.splice(best, 1);
    }
    votes.push({ v, age: 0 });
    mine = { v, age: 0 };
    receivedAt = performance.now();
    render();
    pending = v;
    flush();
  }

  async function flush() {
    if (sending || pending == null) return;
    const wait = lastSent + GAP - Date.now();
    if (wait > 0) { setTimeout(flush, wait); return; }
    const v = pending;
    pending = null;
    sending = true;
    lastSent = Date.now();
    try {
      const st = await rpc('gabi_vote', { p_key: KEY, p_value: v });
      if (pending == null) apply(st);
    } catch (err) {
      showErr(err.message);
      if (pending == null) refresh();
    } finally {
      sending = false;
      if (pending != null) flush();
    }
  }

  pad.addEventListener('pointerdown', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    e.preventDefault();
    b.classList.add('press');
    setTimeout(() => b.classList.remove('press'), 150);
    vote(+b.dataset.v);
  });
  pad.addEventListener('contextmenu', (e) => e.preventDefault());

  // ---------- Rendern ----------
  function render() {
    const el = (performance.now() - receivedAt) / 1000;
    let sw = 0, swv = 0, active = 0;
    votes.forEach((x) => {
      const w = Math.max(0, 1 - (x.age + el) / DECAY);
      if (w <= 0) return;
      sw += w; swv += w * x.v; active++;
    });

    const valEl = $('value');
    const track = $('track');
    if (sw > 0) {
      const avg = swv / sw;
      valEl.textContent = avg.toFixed(1).replace('.', ',');
      valEl.classList.remove('empty');
      track.classList.remove('empty');
      const pct = ((avg - 1) / 9) * 100;
      $('fill').style.width = pct + '%';
      $('knob').style.left = pct + '%';
      $('meta').textContent = active + (active === 1 ? ' Stimme' : ' Stimmen');
    } else {
      valEl.textContent = '–';
      valEl.classList.add('empty');
      track.classList.add('empty');
      $('fill').style.width = '0';
      $('meta').textContent = 'Noch keine Stimmen';
    }

    const myW = mine ? Math.max(0, 1 - (mine.age + el) / DECAY) : 0;
    pad.querySelectorAll('button').forEach((b) => {
      const isMine = myW > 0 && +b.dataset.v === mine.v;
      b.classList.toggle('mine', isMine);
      b.querySelector('.w').style.height = isMine ? (myW * 100) + '%' : '0';
    });
    if (myW > 0) {
      const left = Math.ceil(DECAY * myW / 60);
      $('mine').innerHTML = 'Dein Wert <b>' + mine.v + '</b> · noch ' + left + ' min';
    } else {
      $('mine').innerHTML = '&nbsp;';
    }
  }

  // ---------- Sync ----------
  async function refresh() {
    try {
      const st = await rpc('gabi_state', { p_key: KEY });
      if (!sending && pending == null) apply(st);
    }
    catch (e) { showErr('Offline?'); }
  }
  refresh();
  setInterval(() => { if (!document.hidden) refresh(); }, POLL);
  setInterval(render, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { refresh(); loadHistory(); } });

  // ============================================================
  //  Verlauf (Datenpunkte speichert Supabase per pg_cron:
  //  24 h → alle 2 min, 7 Tage → alle 30 min, alte werden gelöscht)
  // ============================================================
  const RANGES = {
    day:  { span: 24 * 3600e3, step: 2 * 60e3 },
    week: { span: 7 * 24 * 3600e3, step: 30 * 60e3 }
  };
  let range = 'day';
  try { if (localStorage.getItem('gabimeter_range') === 'week') range = 'week'; } catch (e) { /* egal */ }
  let hist = [];            // [[ms, wert|null], ...]
  let histT0 = 0, histT1 = 0;
  let geo = null;           // Geometrie fürs Antippen

  const svg = $('svg');
  const chart = $('chart');
  const NS = 'http://www.w3.org/2000/svg';

  function paintSeg() {
    $('seg').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.range === range));
  }
  paintSeg();
  $('seg').addEventListener('click', (e) => {
    const b = e.target.closest('[data-range]');
    if (!b || b.dataset.range === range) return;
    range = b.dataset.range;
    try { localStorage.setItem('gabimeter_range', range); } catch (err) { /* egal */ }
    paintSeg();
    hist = [];
    drawChart();
    loadHistory();
  });

  async function loadHistory() {
    try {
      const data = await rpc('gabi_history', { p_range: range });
      hist = Array.isArray(data) ? data.map((p) => [+p[0], p[1] == null ? null : +p[1]]) : [];
      drawChart();
    } catch (e) {
      hist = [];
      drawChart('Verlauf nicht verfügbar');
    }
  }

  const pad2 = (n) => String(n).padStart(2, '0');
  const DAYS = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

  function el(tag, attrs, text) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }

  function drawChart(msg) {
    const W = chart.clientWidth, H = chart.clientHeight;
    if (!W) return;
    const L = 26, R = 10, T = 12, B = 22;
    const iw = W - L - R, ih = H - T - B;
    const cfg = RANGES[range];
    histT1 = Date.now();
    histT0 = histT1 - cfg.span;
    const x = (t) => L + ((t - histT0) / cfg.span) * iw;
    const y = (v) => T + (1 - (v - 1) / 9) * ih;
    geo = { L, iw, x, y };

    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.innerHTML = '';
    const defs = el('defs', {});
    const grad = el('linearGradient', { id: 'gArea', x1: 0, y1: 0, x2: 0, y2: 1 });
    grad.appendChild(el('stop', { offset: '0%', 'stop-color': '#ff5c8a', 'stop-opacity': 0.32 }));
    grad.appendChild(el('stop', { offset: '100%', 'stop-color': '#ff5c8a', 'stop-opacity': 0 }));
    defs.appendChild(grad);
    svg.appendChild(defs);

    // Raster 1 / 5 / 10
    [1, 5, 10].forEach((v) => {
      svg.appendChild(el('line', { class: 'grid', x1: L, x2: W - R, y1: y(v), y2: y(v) }));
      svg.appendChild(el('text', { class: 'lbl', x: L - 6, y: y(v) + 3.5, 'text-anchor': 'end' }, v));
    });

    // Zeitachse
    const ticks = [];
    if (range === 'day') {
      const d = new Date(histT0);
      d.setMinutes(0, 0, 0);
      d.setHours(d.getHours() + 1);
      while (d.getHours() % 6) d.setHours(d.getHours() + 1);
      for (; d.getTime() <= histT1; d.setHours(d.getHours() + 6)) {
        ticks.push([d.getTime(), pad2(d.getHours()) + ':00']);
      }
    } else {
      const d = new Date(histT0);
      d.setHours(24, 0, 0, 0);
      for (; d.getTime() <= histT1; d.setDate(d.getDate() + 1)) ticks.push([d.getTime(), DAYS[d.getDay()]]);
    }
    ticks.forEach(([t, label]) => {
      const xx = x(t);
      if (xx < L + 8 || xx > W - R - 8) return;
      svg.appendChild(el('line', { class: 'grid', x1: xx, x2: xx, y1: T, y2: T + ih }));
      svg.appendChild(el('text', { class: 'lbl', x: xx, y: H - 7, 'text-anchor': 'middle' }, label));
    });

    // Linie in Segmente zerlegen (Lücke bei null oder fehlenden Punkten)
    const pts = hist.filter((p) => p[0] >= histT0 - cfg.step);
    const segs = [];
    let cur = null, prevT = null;
    pts.forEach(([t, v]) => {
      const gap = prevT != null && t - prevT > cfg.step * 2.5;
      if (v == null || gap) { if (cur && cur.length) segs.push(cur); cur = null; }
      if (v != null) { (cur = cur || []).push([x(Math.max(t, histT0)), y(v)]); }
      prevT = t;
    });
    if (cur && cur.length) segs.push(cur);

    segs.forEach((sg) => {
      if (sg.length === 1) sg = [[sg[0][0] - 1.5, sg[0][1]], [sg[0][0] + 1.5, sg[0][1]]];
      const line = sg.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
      const area = line + ' L' + sg[sg.length - 1][0].toFixed(1) + ' ' + (T + ih) + ' L' + sg[0][0].toFixed(1) + ' ' + (T + ih) + ' Z';
      svg.appendChild(el('path', { class: 'area', d: area }));
      svg.appendChild(el('path', { class: 'line', d: line }));
    });

    const has = pts.some((p) => p[1] != null);
    const em = $('chartEmpty');
    em.textContent = msg || (has ? '' : (hist.length ? 'Keine Stimmen in diesem Zeitraum' : 'Noch keine Daten'));
    em.style.display = em.textContent ? '' : 'none';
    $('readout').innerHTML = '&nbsp;';
  }

  // Antippen / Hovern zeigt den Wert zum Zeitpunkt
  function showAt(clientX) {
    if (!geo || !hist.length) return;
    const r = chart.getBoundingClientRect();
    const t = histT0 + ((clientX - r.left - geo.L) / geo.iw) * (histT1 - histT0);
    let best = null, bd = Infinity;
    hist.forEach((p) => {
      if (p[1] == null || p[0] < histT0) return;
      const d = Math.abs(p[0] - t);
      if (d < bd) { bd = d; best = p; }
    });
    svg.querySelectorAll('.cursor,.dot').forEach((n) => n.remove());
    if (!best || bd > RANGES[range].step * 3) { $('readout').innerHTML = '&nbsp;'; return; }
    const cx = geo.x(best[0]), cy = geo.y(best[1]);
    svg.appendChild(el('line', { class: 'cursor', x1: cx, x2: cx, y1: 12, y2: chart.clientHeight - 22 }));
    svg.appendChild(el('circle', { class: 'dot', cx, cy, r: 4 }));
    const d = new Date(best[0]);
    const when = (range === 'week' ? DAYS[d.getDay()] + ' ' : '') + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    $('readout').innerHTML = when + ' · <b>' + best[1].toFixed(1).replace('.', ',') + '</b>';
  }
  chart.addEventListener('pointermove', (e) => showAt(e.clientX));
  chart.addEventListener('pointerdown', (e) => showAt(e.clientX));
  chart.addEventListener('pointerleave', (e) => {
    if (e.pointerType === 'mouse') {
      svg.querySelectorAll('.cursor,.dot').forEach((n) => n.remove());
      $('readout').innerHTML = '&nbsp;';
    }
  });

  let rsT;
  window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => drawChart(), 150); });
  loadHistory();
  setInterval(() => { if (!document.hidden) loadHistory(); }, 60e3);
})();
</script>
</body>
</html>
