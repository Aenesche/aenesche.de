<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<meta name="robots" content="noindex">
<title>Gabi-Meter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0e;
    --bg-2: #141417;
    --line: rgba(255, 255, 255, 0.08);
    --text: #ece9e4;
    --muted: #8a8780;
    --pink: #ff5c8a;
    --pink-ink: #1a0710;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    color: var(--text);
    font-family: 'Sora', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: max(20px, env(safe-area-inset-top)) 16px calc(20px + var(--safe-b));
    user-select: none;
    -webkit-user-select: none;
  }
  .mono { font-family: 'Space Mono', ui-monospace, monospace; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  .wrap { width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: center; }

  h1 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--muted);
  }
  h1 span { color: var(--pink); }

  .value {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: clamp(96px, 34vw, 168px);
    line-height: 1;
    margin: 18px 0 4px;
    color: var(--pink);
    text-shadow: 0 0 40px rgba(255, 92, 138, 0.35);
    font-variant-numeric: tabular-nums;
    transition: color 0.3s;
  }
  .value.empty { color: rgba(255, 255, 255, 0.15); text-shadow: none; }
  .meta { font-size: 11.5px; color: var(--muted); height: 16px; }

  /* Skala */
  .track {
    position: relative;
    width: 100%;
    height: 10px;
    margin: 34px 0 26px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.07);
  }
  .track .fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0;
    border-radius: 10px;
    background: linear-gradient(90deg, rgba(255, 92, 138, 0.25), var(--pink));
    box-shadow: 0 0 14px rgba(255, 92, 138, 0.45);
    transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .track .knob {
    position: absolute;
    top: 50%;
    left: 0;
    width: 22px;
    height: 22px;
    margin: -11px 0 0 -11px;
    border-radius: 50%;
    background: var(--text);
    box-shadow: 0 0 0 4px var(--bg), 0 0 18px rgba(255, 92, 138, 0.7);
    transition: left 0.8s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s;
  }
  .track.empty .knob { opacity: 0; }

  /* Buttons 1–10 */
  .pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; }
  .pad button {
    position: relative;
    height: 62px;
    border-radius: 14px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    font-family: 'Space Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    overflow: hidden;
    transition: transform 0.08s, border-color 0.15s;
  }
  .pad button:active { transform: scale(0.94); }
  .pad button .w {
    position: absolute;
    inset: auto 0 0 0;
    height: 0;
    background: var(--pink);
    opacity: 0.9;
    transition: height 1s linear;
  }
  .pad button b { position: relative; }
  .pad button.mine { border-color: var(--pink); }
  .pad button.mine b { color: var(--text); }
  .pad button:disabled { opacity: 0.6; }

  .mine-line { margin-top: 16px; font-size: 11.5px; color: var(--muted); height: 16px; text-align: center; }
  .mine-line b { color: var(--text); font-weight: 700; }

  .err { position: fixed; bottom: calc(16px + var(--safe-b)); left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--muted); opacity: 0; transition: opacity 0.2s; }
  .err.show { opacity: 1; }
</style>
</head>
<body>

<div class="wrap">
  <h1>GABI<span>-</span>METER</h1>
  <div class="value empty" id="value">–</div>
  <div class="meta mono" id="meta">&nbsp;</div>

  <div class="track empty" id="track"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>

  <div class="pad" id="pad"></div>
  <div class="mine-line mono" id="mine">&nbsp;</div>
</div>
<div class="err mono" id="err"></div>

<script>
(function () {
  'use strict';

  const SB_URL = 'https://usihbregbanpfspblrnw.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzaWhicmVnYmFucGZzcGJscm53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxMDkyNzEsImV4cCI6MjA4NzY4NTI3MX0.U_f2brykxMbegtddye-hpy0lcJgtEzl1AB9lQGpd5UY';
  const DECAY = 30 * 60;   // Sekunden bis eine Stimme kein Gewicht mehr hat
  const POLL = 4000;       // ms

  const $ = (id) => document.getElementById(id);

  // Geheimer Geräte-Key (statt Login) – Server speichert nur den Hash
  function getKey() {
    let k = null;
    try { k = localStorage.getItem('gabimeter_key'); } catch (e) { /* privat */ }
    if (!k) {
      const a = new Uint8Array(24);
      crypto.getRandomValues(a);
      k = Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');
      try { localStorage.setItem('gabimeter_key', k); } catch (e) { /* egal */ }
    }
    return k;
  }
  const KEY = getKey();

  // Zustand: Alter jeder Stimme zum Empfangszeitpunkt + lokale Uhr
  let votes = [];          // [{v, age}]
  let mine = null;         // {v, age} | null
  let receivedAt = 0;

  async function rpc(fn, body) {
    const r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: {
        apikey: SB_KEY,
        Authorization: 'Bearer ' + SB_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });
    const data = await r.json().catch(() => null);
    if (!r.ok) throw new Error((data && data.message) || 'Fehler ' + r.status);
    return data;
  }

  function apply(state) {
    votes = (state && state.votes) || [];
    mine = (state && state.mine) || null;
    receivedAt = performance.now();
    render();
  }

  let errT;
  function showErr(msg) {
    const e = $('err');
    e.textContent = msg;
    e.classList.add('show');
    clearTimeout(errT);
    errT = setTimeout(() => e.classList.remove('show'), 2500);
  }

  // ---------- Buttons ----------
  const pad = $('pad');
  for (let i = 1; i <= 10; i++) {
    const b = document.createElement('button');
    b.dataset.v = i;
    b.innerHTML = '<span class="w"></span><b>' + i + '</b>';
    pad.appendChild(b);
  }
  pad.addEventListener('click', async (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const v = +b.dataset.v;
    // sofort lokal anzeigen
    const prev = { votes: votes.slice(), mine };
    const el = (performance.now() - receivedAt) / 1000;
    votes = votes.map((x) => ({ v: x.v, age: x.age + el }));
    if (mine) {
      const i = votes.findIndex((x) => x.v === mine.v && Math.abs(x.age - (mine.age + el)) < 1);
      if (i >= 0) votes.splice(i, 1);
    }
    votes.push({ v, age: 0 });
    mine = { v, age: 0 };
    receivedAt = performance.now();
    render();
    try {
      apply(await rpc('gabi_vote', { p_key: KEY, p_value: v }));
    } catch (err) {
      votes = prev.votes; mine = prev.mine;
      render();
      showErr(err.message);
    }
  });

  // ---------- Rendern ----------
  function render() {
    const el = (performance.now() - receivedAt) / 1000;
    let sw = 0, swv = 0, active = 0;
    votes.forEach((x) => {
      const w = Math.max(0, 1 - (x.age + el) / DECAY);
      if (w <= 0) return;
      sw += w; swv += w * x.v; active++;
    });

    const valEl = $('value');
    const track = $('track');
    if (sw > 0) {
      const avg = swv / sw;
      valEl.textContent = avg.toFixed(1).replace('.', ',');
      valEl.classList.remove('empty');
      track.classList.remove('empty');
      const pct = ((avg - 1) / 9) * 100;
      $('fill').style.width = pct + '%';
      $('knob').style.left = pct + '%';
      $('meta').textContent = active + (active === 1 ? ' Stimme' : ' Stimmen');
    } else {
      valEl.textContent = '–';
      valEl.classList.add('empty');
      track.classList.add('empty');
      $('fill').style.width = '0';
      $('meta').textContent = 'Noch keine Stimmen';
    }

    const myW = mine ? Math.max(0, 1 - (mine.age + el) / DECAY) : 0;
    pad.querySelectorAll('button').forEach((b) => {
      const isMine = myW > 0 && +b.dataset.v === mine.v;
      b.classList.toggle('mine', isMine);
      b.querySelector('.w').style.height = isMine ? (myW * 100) + '%' : '0';
    });
    if (myW > 0) {
      const left = Math.ceil(DECAY * myW / 60);
      $('mine').innerHTML = 'Dein Wert <b>' + mine.v + '</b> · zählt noch ' + Math.round(myW * 100) + '% · ' + left + ' min';
    } else {
      $('mine').innerHTML = '&nbsp;';
    }
  }

  // ---------- Sync ----------
  async function refresh() {
    try { apply(await rpc('gabi_state', { p_key: KEY })); }
    catch (e) { showErr('Offline?'); }
  }
  refresh();
  setInterval(() => { if (!document.hidden) refresh(); }, POLL);
  setInterval(render, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
