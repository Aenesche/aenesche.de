<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AENESCHE</title>
    <meta name="description" content="Kleine Web-Projekte, Tools und Spiele.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0c0c0f;
            --surface: #16161a;
            --border: #2a2a32;
            --border-hover: #3a3a45;
            --text: #ececf1;
            --text-muted: #72727e;
            --accent: #e8e4dd;
            --accent-warm: #f5c77e;
            --radius: 14px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Sora', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ── Subtle grain overlay ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 200px;
            pointer-events: none;
            z-index: 100;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px;
        }

        .label {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(2.8rem, 8vw, 5rem);
            font-weight: 700;
            letter-spacing: -2px;
            color: var(--accent);
            line-height: 1.05;
        }

        .tagline {
            margin-top: 18px;
            font-size: 1.05rem;
            font-weight: 300;
            color: var(--text-muted);
            max-width: 440px;
            line-height: 1.6;
        }

        .cta {
            margin-top: 44px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 32px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                        border-color 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .cta:hover {
            transform: translateY(-4px);
            border-color: var(--border-hover);
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.5);
            color: var(--accent-warm);
        }

        .cta svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        footer {
            padding: 28px 24px;
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            border-top: 1px solid var(--border);
        }

        footer a {
            color: var(--text-muted);
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.2s ease;
        }

        footer a:hover { color: var(--accent-warm); }

        /* ── Entrance animation ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .label   { animation: fadeUp 0.7s 0.05s ease both; }
        h1       { animation: fadeUp 0.7s 0.15s ease both; }
        .tagline { animation: fadeUp 0.7s 0.3s ease both; }
        .cta     { animation: fadeUp 0.7s 0.45s ease both; }
        footer   { animation: fadeUp 0.7s 0.6s ease both; }
    </style>
</head>
<body>

    <main>
        <div class="label">jeder braucht ein Hobby I guess</div>
        <h1>AENESCHE.DE</h1>
        <p class="tagline">Kleine Web-Projekte, Tools und Games.. alles im Browser.</p>
        <a class="cta" href="/projects/index.html">
            Zu den Projekten
            <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
    </main>

    <footer>
        <a href="/leaderboard.html">Leaderboard</a>
        <a href="/datenschutz">Datenschutz</a>
        <a href="/impressum">Impressum</a>
        <a href="mailto:hello@aenesche.de">Kontakt</a>
    </footer>

</body>
</html>
